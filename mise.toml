# Shared workstation toolchain. Bootstrap installs this globally; projects may override it.
# See scripts/dev/README.md. Commit mise.lock whenever changing these pins.
min_version = "2026.10.24"

[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-x64", "macos-arm64", "windows-x64"]

[tools]
gh = "2.103.3"
shellcheck = "0.11.0"
actionlint = "1.7.12"
opentofu = "1.13.0"
bun = "1.4.4"
node = "26.13.0"
atlas = { version = "1.3.0", os = ["linux", "macos"], lazy = true }
azure-cli = { version = "2.91.0", lazy = true }
pnpm = "12.16.1"
"npm:@yarnpkg/cli-dist" = "4.18.1"
deno = "2.9.8"
python = "3.15.2"
uv = "0.13.6"
go = "1.27.3"
jq = "1.8.2"
yq = "4.54.1"
ripgrep = "15.2.0"
fd = "10.5.0"
fzf = "0.74.5"
bat = "0.26.1"
delta = "0.18.2"
git-lfs = "3.8.1"
docker-cli = "29.9.2"
"npm:vercel" = "65.8.0"
"npm:wrangler" = "4.156.0"
railway = "5.71.0"
"aqua:anomalyco/opencode" = "1.19.5"
vault = "2.2.1"
claude = "2.1.314"
codex = "0.166.0"
gemini = { version = "0.66.0", allow_builds = ["@lydell/node-pty"] }
copilot = "1.0.105"

# Keep self-updaters from bypassing the reviewed toolchain lock.
[env]
DISABLE_AUTOUPDATER = "1"
COPILOT_AUTO_UPDATE = "false"
