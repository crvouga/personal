---
- name: Create persistent worker credential renewal units
  ansible.builtin.file:
    path: '{{ development_home }}/.config/systemd/user'
    state: directory
    owner: '{{ development_user }}'
    mode: '0700'
- name: Declare native self-token renewal without copying credentials
  ansible.builtin.copy:
    dest: '{{ development_home }}/.config/systemd/user/personal-worker-auth.service'
    owner: '{{ development_user }}'
    mode: '0600'
    content: |
      [Unit]
      Description=Renew this worker's own Vault authorization
      [Service]
      Type=oneshot
      WorkingDirectory={{ development_source }}
      ExecStart={{ development_home }}/.local/bin/mise exec -- bun scripts/dev/worker-auth.ts
      Environment="PATH={{ development_home }}/.local/share/mise/shims:{{ development_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
      UMask=0077
      TimeoutStartSec=45
- name: Declare bounded persistent renewal schedule
  ansible.builtin.copy:
    dest: '{{ development_home }}/.config/systemd/user/personal-worker-auth.timer'
    owner: '{{ development_user }}'
    mode: '0600'
    content: |
      [Unit]
      Description=Keep enrolled worker Vault authorization renewed
      [Timer]
      OnBootSec=2min
      OnUnitActiveSec=10min
      Persistent=true
      [Install]
      WantedBy=timers.target
- name: Enable this user's credential renewal timer
  become: true
  become_user: '{{ development_user }}'
  environment:
    XDG_RUNTIME_DIR: '/run/user/{{ development_uid }}'
  ansible.builtin.systemd_service:
    scope: user
    name: personal-worker-auth.timer
    daemon_reload: true
    enabled: true
    state: started
