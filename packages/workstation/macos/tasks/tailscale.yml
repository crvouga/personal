---
# Prefer the Homebrew formula (CLI + tailscaled system daemon with launchd
# KeepAlive) for an always-on worker. An existing Tailscale.app is accepted and
# never replaced; device identity and login state are never copied or reset.
- name: Locate existing Tailscale installations
  ansible.builtin.stat:
    path: '{{ item }}'
  loop:
    - /opt/homebrew/bin/tailscale
    - /usr/local/bin/tailscale
    - /Applications/Tailscale.app/Contents/MacOS/Tailscale
  register: tailscale_paths
- name: Select the tailscale executable
  ansible.builtin.set_fact:
    tailscale_cli: "{{ (tailscale_paths.results | selectattr('stat.exists') | map(attribute='item') | list | first) | default('') }}"
- name: Locate Homebrew for a missing installation
  ansible.builtin.stat:
    path: '{{ item }}'
  loop: [/opt/homebrew/bin/brew, /usr/local/bin/brew]
  register: brew_paths
  when: tailscale_cli == ''
- name: Install the Tailscale formula through the designated user's Homebrew
  become: true
  become_user: '{{ development_user }}'
  ansible.builtin.command:
    argv:
      - "{{ (brew_paths.results | selectattr('stat.exists') | map(attribute='item') | list | first) }}"
      - install
      - tailscale
  environment:
    HOMEBREW_NO_AUTO_UPDATE: '1'
    HOMEBREW_NO_INSTALL_CLEANUP: '1'
  when: tailscale_cli == '' and (brew_paths.results | selectattr('stat.exists') | list | length) > 0
  register: brew_install
  changed_when: true
- name: Re-locate the installed executable
  ansible.builtin.stat:
    path: '{{ item }}'
  loop: [/opt/homebrew/bin/tailscale, /usr/local/bin/tailscale]
  register: tailscale_installed
  when: tailscale_cli == ''
- name: Select the installed executable
  ansible.builtin.set_fact:
    tailscale_cli: "{{ (tailscale_installed.results | selectattr('stat', 'defined') | selectattr('stat.exists') | map(attribute='item') | list | first) | default('') }}"
  when: tailscale_cli == ''
- name: Require an installed Tailscale client
  ansible.builtin.assert:
    that: tailscale_cli != ''
    fail_msg: TAILSCALE_INSTALL_REQUIRED; install Homebrew or Tailscale.app on this Mac, then rerun. Nothing was downloaded without a package manager.
- name: Inspect the system daemon when the formula is installed
  ansible.builtin.command:
    argv: [/bin/launchctl, print, 'system/{{ tailscaleDaemon }}']
  changed_when: false
  failed_when: false
  register: tailscaled_daemon
  when: tailscale_cli is match('^/(opt/homebrew|usr/local)/bin/tailscale$')
- name: Install the always-on tailscaled system daemon
  ansible.builtin.command:
    argv: ['{{ tailscale_cli }}d', install-system-daemon]
  when: tailscaled_daemon is not skipped and tailscaled_daemon.rc != 0
  changed_when: true
- name: Inspect native authentication without prompting or opening a browser
  ansible.builtin.command:
    argv: ['{{ tailscale_cli }}', status, '--json']
  changed_when: false
  failed_when: false
  register: tailscale_status
  no_log: true
- name: Require genuine device authentication before claiming connectivity
  ansible.builtin.assert:
    that:
      - tailscale_status.rc == 0
      - (tailscale_status.stdout | from_json).BackendState == 'Running'
    fail_msg: TAILSCALE_LOGIN_REQUIRED; authorize this device through its native login. Existing state is never copied or reset.
  no_log: true
