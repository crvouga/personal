---
# launchd counterpart of ../../ubuntu/tasks/credentials.yml: this worker renews
# its own Vault authorization and GitHub login; nothing is copied between machines.
- name: Create the designated user's LaunchAgents directory
  ansible.builtin.file:
    path: '{{ development_home }}/Library/LaunchAgents'
    state: directory
    owner: '{{ development_user }}'
    mode: '0755'
- name: Declare native self-token renewal without copying credentials
  ansible.builtin.copy:
    dest: '{{ development_home }}/Library/LaunchAgents/{{ credentialRenewalAgent }}.plist'
    owner: '{{ development_user }}'
    mode: '0644'
    content: |
      <?xml version="1.0" encoding="UTF-8"?>
      <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
      <!-- Managed by personal Fleet: packages/workstation/macos -->
      <plist version="1.0"><dict>
        <key>Label</key><string>{{ credentialRenewalAgent }}</string>
        <key>ProgramArguments</key><array>
          <string>{{ development_home }}/.local/bin/mise</string>
          <string>exec</string>
          <string>--</string>
          <string>bun</string>
          <string>scripts/dev/worker-auth.ts</string>
        </array>
        <key>WorkingDirectory</key><string>{{ development_source }}</string>
        <key>EnvironmentVariables</key><dict>
          <key>PATH</key><string>{{ development_home }}/.local/share/mise/shims:{{ development_home }}/.local/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin</string>
        </dict>
        <key>StartInterval</key><integer>600</integer>
        <key>RunAtLoad</key><true/>
        <key>Umask</key><integer>63</integer>
        <key>LowPriorityIO</key><true/>
        <key>Nice</key><integer>10</integer>
      </dict></plist>
  register: renewal_agent
- name: Inspect whether the renewal agent is loaded in the user's session
  become: true
  become_user: '{{ development_user }}'
  ansible.builtin.command:
    argv:
      [
        /bin/launchctl,
        print,
        'gui/{{ development_uid }}/{{ credentialRenewalAgent }}',
      ]
  changed_when: false
  failed_when: false
  register: renewal_loaded
- name: Load or refresh the renewal agent; a headless Mac loads it at next login
  become: true
  become_user: '{{ development_user }}'
  ansible.builtin.command:
    argv:
      - /bin/launchctl
      - '{{ item }}'
      - 'gui/{{ development_uid }}'
      - '{{ development_home }}/Library/LaunchAgents/{{ credentialRenewalAgent }}.plist'
  loop: "{{ ['bootout', 'bootstrap'] if (renewal_loaded.rc == 0 and renewal_agent.changed) else (['bootstrap'] if renewal_loaded.rc != 0 else []) }}"
  failed_when: false
  changed_when: true
