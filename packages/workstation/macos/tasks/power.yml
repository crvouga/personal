---
- name: Inspect effective power management settings
  ansible.builtin.command:
    argv: [/usr/bin/pmset, -g, custom]
  changed_when: false
  register: pmset_custom
# pmset -g custom lists every key this hardware supports; a key that is absent
# (for example autorestart on laptops) is unsupported and deliberately skipped.
- name: Declare never-sleep, wake-on-network and restart-after-power-loss policy
  ansible.builtin.command:
    argv: [/usr/bin/pmset, -a, '{{ item.key }}', '{{ item.value }}']
  loop: '{{ pmset | dict2items }}'
  loop_control:
    label: '{{ item.key }}'
  vars:
    observed: "{{ pmset_custom.stdout | regex_findall('^\\s*' ~ item.key ~ '\\s+(\\S+)\\s*$', multiline=True) | unique }}"
  when: observed | length > 0 and observed != [item.value | string]
  changed_when: true
- name: Verify the running power policy without trusting the installer
  ansible.builtin.command:
    argv: [/usr/bin/pmset, -g, custom]
  changed_when: false
  register: pmset_verified
- name: Require every supported power setting to be effective
  ansible.builtin.assert:
    that: observed | length == 0 or observed == [item.value | string]
    fail_msg: MACOS_POWER_POLICY_DRIFT; pmset did not accept {{ item.key }}. Inspect Energy settings and MDM profiles.
  loop: '{{ pmset | dict2items }}'
  loop_control:
    label: '{{ item.key }}'
  vars:
    observed: "{{ pmset_verified.stdout | regex_findall('^\\s*' ~ item.key ~ '\\s+(\\S+)\\s*$', multiline=True) | unique }}"
