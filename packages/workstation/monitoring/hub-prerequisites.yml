---
- name: Inspect native Docker engine ownership
  ansible.builtin.stat:
    path: /usr/bin/dockerd
  register: docker_engine
- name: Inspect installed packages before adopting a Docker installation
  ansible.builtin.package_facts:
    manager: apt
- name: Refuse an incomplete third-party Docker installation
  ansible.builtin.assert:
    that: "'docker-ce' not in ansible_facts.packages and 'containerd.io' not in ansible_facts.packages"
    fail_msg: BESZEL_DOCKER_OWNER_CONFLICT; recover the existing Docker owner instead of installing a competing engine.
  when: not docker_engine.stat.exists
- name: Install missing native engine and Compose from the reviewed Ubuntu snapshot
  ansible.builtin.import_tasks: ../ubuntu/tasks/packages.yml
  vars:
    packages:
      docker.io: 29.1.3-0ubuntu4.1
      docker-compose-v2: 2.40.3+ds1-0ubuntu1
  when: not docker_engine.stat.exists
- name: Enable the native Docker daemon without restarting a running engine
  ansible.builtin.systemd_service:
    name: docker.service
    enabled: true
    state: started
- name: Verify Compose support before touching hub data
  ansible.builtin.command:
    argv: [docker, compose, version]
  changed_when: false
