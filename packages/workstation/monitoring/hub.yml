---
- name: Converge the explicitly selected Beszel hub
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  vars_files:
    - ../ubuntu/policy.json
  vars:
    beszel_lock: "{{ lookup('ansible.builtin.file', 'lock.json') | from_json }}"
  tasks:
    - name: Require the reviewed Ubuntu release before host package changes
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Ubuntu'
          - ansible_facts.distribution_version == release
          - ansible_facts.architecture in ['x86_64', 'aarch64']
        fail_msg: BESZEL_UBUNTU_BASELINE_MISMATCH; no distribution upgrade is permitted.
    - name: Validate private dashboard URL
      ansible.builtin.assert:
        that: beszel_hub_url is match('^https://[a-z0-9.-]+\.ts\.net:8443$')
    - ansible.builtin.import_tasks: hub-prerequisites.yml
    - name: Inspect an existing hub image before any upgrade
      ansible.builtin.command:
        argv:
          [
            docker,
            inspect,
            '--format',
            '{{ "{{.Config.Image}}" }}',
            personal-beszel-hub-1,
          ]
      changed_when: false
      failed_when: false
      register: existing_hub
    - name: Require explicit maintenance for a different existing image
      ansible.builtin.assert:
        that: existing_hub.rc != 0 or existing_hub.stdout == beszel_lock.image
        fail_msg: BESZEL_HUB_UPGRADE_PENDING; take and verify a backup before an explicit maintenance upgrade.
    - name: Create persistent hub data directory without replacing existing data
      ansible.builtin.file:
        path: /var/lib/personal-beszel
        state: directory
        owner: root
        group: root
        mode: '0700'
    - name: Start pinned stock Compose service
      ansible.builtin.command:
        argv:
          [
            docker,
            compose,
            '-f',
            '{{ playbook_dir }}/compose.yml',
            up,
            '-d',
            '--pull',
            missing,
          ]
      environment:
        BESZEL_HUB_URL: '{{ beszel_hub_url }}'
      register: hub_apply
      changed_when: "'Started' in hub_apply.stderr or 'Created' in hub_apply.stderr or 'Recreated' in hub_apply.stderr"
    - name: Independently verify the local hub health endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:8090/api/health
        status_code: 200
        return_content: false
      retries: 10
      delay: 2
      register: hub_health
      until: hub_health.status == 200
