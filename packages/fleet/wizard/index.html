<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fleet installer</title>
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/admin.css" />
  </head>
  <body>
    <header class="admin-header">
      <div class="admin-brand">
        <span class="admin-mark">▤</span>
        <div>
          Fleet
          <div class="admin-subtitle">Installer console</div>
        </div>
      </div>
      <label class="admin-theme"
        ><span>Appearance</span
        ><select id="admin-theme" aria-label="Color theme">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
          <option value="auto">System</option>
        </select></label
      >
    </header>
    <main class="admin-main">
      <div class="admin-intro">
        <h1>Fleet installer</h1>
        <p>
          Choose a node role and confirm the disk. Preparation and installation
          run automatically.
        </p>
      </div>
      <ol class="admin-stepper" aria-label="Installation progress">
        <li data-step="choose" aria-current="step">1 · Choose</li>
        <li data-step="configure">2 · Configure</li>
        <li data-step="review">3 · Review</li>
        <li data-step="install">4 · Install</li>
      </ol>
      <noscript><p class="fail">This page needs JavaScript.</p></noscript>
      <section id="app" class="admin-card" aria-live="polite">
        <p>Looking at this computer…</p>
      </section>
    </main>

    <script>
      'use strict';
      const TOKEN =
        new URLSearchParams(location.search).get('t') ||
        sessionStorage.getItem('fleet-token') ||
        '';
      if (TOKEN) sessionStorage.setItem('fleet-token', TOKEN);
      history.replaceState(null, '', location.pathname);
      const state = {
        scan: null,
        mode: null,
        role: null,
        usb: null,
        token: '',
        plan: null,
        sshKey: '',
        sawReboot: false,
        lastJob: null,
        lastBody: null,
        wifi: null,
        retry: null,
        problem: null,
        report: '',
        issueUrl: null,
        diagnostic: null,
        diagnosticTicket: 0,
      };
      const app = document.getElementById('app');

      async function api(path, body) {
        let res;
        try {
          res = await fetch(path, {
            method: body === undefined ? 'GET' : 'POST',
            headers: {
              'X-Fleet-Token': TOKEN,
              'Content-Type': 'application/json',
            },
            body: body === undefined ? undefined : JSON.stringify(body),
          });
        } catch (e) {
          const err = new Error(
            'This page lost its connection to the Fleet installer program.'
          );
          err.fix =
            'Check that the Fleet installer is still running (its window or terminal is open), then press Try again. If it was closed, start it again.';
          throw err;
        }
        let data = {};
        try {
          data = await res.json();
        } catch (e) {
          /* not JSON */
        }
        if (!res.ok) {
          const err = new Error(data.error || 'HTTP ' + res.status);
          err.fix = data.fix;
          err.guidance = data.guidance;
          err.log = data.log;
          throw err;
        }
        return data;
      }
      function esc(s) {
        return String(s == null ? '' : s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
              "'": '&#39;',
            })[c]
        );
      }
      function show(html) {
        const previousHeading = app.querySelector('h2')?.textContent;
        app.innerHTML = html;
        const step = /Working|Restarting|Done|did not finish|Cancelled/.test(
          html
        )
          ? 'install'
          : state.plan
            ? 'review'
            : state.mode
              ? 'configure'
              : 'choose';
        document.querySelectorAll('[data-step]').forEach((item) => {
          if (item.dataset.step === step)
            item.setAttribute('aria-current', 'step');
          else item.removeAttribute('aria-current');
        });
        const heading = app.querySelector('h2');
        if (heading && heading.textContent !== previousHeading) {
          heading.tabIndex = -1;
          heading.focus({ preventScroll: true });
        }
      }
      function problem(err, retry, where) {
        return trouble({
          message: err.message,
          fix: err.fix,
          guidance: err.guidance,
          log: err.log,
          retry: retry || (() => start()),
          where: where,
        });
      }
      // One recovery panel for every failure: what happened, what to do, a
      // retry where it is safe, and a report an agent or an issue can use.
      function trouble(t) {
        const g = t.guidance || {};
        state.retry = t.retry && g.retry !== false ? t.retry : null;
        state.problem = t.job
          ? null
          : {
              message: t.message,
              fix: t.fix,
              where: t.where,
              mode: state.mode,
              role: state.role,
            };
        state.report = fallbackReport(t);
        state.issueUrl = null;
        const steps =
          g.steps && g.steps.length ? g.steps : t.fix ? [t.fix] : [];
        const h =
          '<div class="box"><p class="fail">' +
          esc(t.message) +
          '</p>' +
          (g.summary ? '<p><b>' + esc(g.summary) + '</b></p>' : '') +
          (steps.length
            ? '<p>What to do:</p><ol>' +
              steps.map((step) => '<li>' + esc(step) + '</li>').join('') +
              '</ol>'
            : '') +
          (g.safety ? '<p><small>' + esc(g.safety) + '</small></p>' : '') +
          (t.log ? '<p><small>Log: ' + esc(t.log) + '</small></p>' : '') +
          '<p>' +
          (state.retry
            ? '<button class="primary" onclick="retry()">' +
              esc(t.retryLabel || 'Try again') +
              '</button>'
            : '') +
          '<button onclick="copyDiagnostic()">Copy diagnostic report</button>' +
          '<button onclick="reportIssue()">Report on GitHub</button>' +
          (t.noStartOver
            ? ''
            : '<button onclick="start()">Start over</button>') +
          '</p><p id="diagnostic-status" role="status"><small>Copy diagnostic report puts the error, this computer\'s details and the recent log on the clipboard, ready to paste to an agent. Report on GitHub opens a pre-filled public issue; review it before you submit.</small></p>' +
          '<details><summary>Error details for support or an LLM</summary><textarea id="diagnostic-report" readonly rows="12"></textarea></details></div>';
        loadDiagnostic();
        return h;
      }
      function retry() {
        const again = state.retry;
        if (again) again();
      }
      function fallbackReport(t) {
        const j = t.job || state.lastJob;
        const g = t.guidance || {};
        return [
          'Fleet installer diagnostic',
          '(The installer program did not answer, so this report has only what the page knows.)',
          'Version: ' + (j?.version || state.scan?.version || 'unknown'),
          'System: ' +
            (state.scan?.os || 'unknown') +
            ' / ' +
            (state.scan?.arch || 'unknown'),
          'Where: ' + (t.where || 'install job'),
          'Mode: ' + state.mode,
          'State: ' + (j?.state || 'connection lost'),
          'Step: ' + (j?.step || 'unknown'),
          'Result: ' + (t.message || j?.message || 'No final result received'),
          'Next: ' + (t.fix || '-'),
          ...(g.steps || []).map((step) => '- ' + step),
          'Log: ' + (t.log || state.scan?.log || 'unavailable'),
          ...(j?.log || []),
        ].join('\n');
      }
      // The report is set as the textarea's value, never as page text, so it
      // cannot be mistaken for the message it describes.
      function fillReport() {
        const box = document.getElementById('diagnostic-report');
        if (box) box.value = state.report;
      }
      async function loadDiagnostic() {
        const ticket = ++state.diagnosticTicket;
        queueMicrotask(fillReport); // after show() has placed the panel
        state.diagnostic = api('/api/diagnostic', {
          problem: state.problem,
        }).then(
          (d) => {
            if (ticket !== state.diagnosticTicket) return;
            state.report = d.report;
            state.issueUrl = d.issue_url;
            fillReport();
          },
          () => {
            /* keep the page's own report */
          }
        );
        return state.diagnostic;
      }
      function diagnosticStatus(text) {
        const status = document.getElementById('diagnostic-status');
        if (status) status.textContent = text;
      }
      async function copyText(text) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch (_) {
          const area = document.createElement('textarea');
          area.value = text;
          area.setAttribute('readonly', '');
          area.style.position = 'fixed';
          area.style.opacity = '0';
          document.body.appendChild(area);
          area.select();
          let copied = false;
          try {
            copied = document.execCommand('copy');
          } catch (__) {
            copied = false;
          }
          area.remove();
          return copied;
        }
      }
      async function copyDiagnostic() {
        await state.diagnostic;
        const copied = await copyText(state.report);
        diagnosticStatus(
          copied
            ? 'Copied. Paste it to an agent, or into a GitHub issue.'
            : 'The clipboard is not available. Open Error details below and copy the text by hand.'
        );
        if (!copied) {
          const details = document
            .getElementById('diagnostic-report')
            ?.closest('details');
          if (details) details.open = true;
          document.getElementById('diagnostic-report')?.select();
        }
      }
      function reportIssue() {
        // Open the window first, while the click still allows it.
        const url =
          state.issueUrl ||
          'https://github.com/crvouga/workspace/issues/new?title=' +
            encodeURIComponent('Fleet installer: installer failure') +
            '&body=' +
            encodeURIComponent(
              'Reported from the Fleet installer.\n\n```text\n' +
                state.report.slice(0, 2500) +
                '\n```\n'
            );
        // A window opened with 'noopener' is always reported as null, so cut
        // the opener link by hand to tell a blocked tab from an opened one.
        const opened = window.open(url, '_blank');
        if (opened) opened.opener = null;
        copyText(state.report).then((copied) => {
          const status = document.getElementById('diagnostic-status');
          if (!status) return;
          status.textContent = opened
            ? 'A pre-filled GitHub issue opened in a new tab. Review it, then press Submit new issue.'
            : 'Your browser blocked the new tab. ';
          if (!opened) {
            const link = document.createElement('a');
            link.href = url;
            link.target = '_blank';
            link.rel = 'noreferrer';
            link.textContent = 'Open the pre-filled GitHub issue';
            status.append(link, '.');
          }
          if (copied)
            status.append(
              ' The full report is also on your clipboard, in case the issue had to be shortened.'
            );
        });
      }
      function gb(n) {
        return n ? (n / 1e9).toFixed(1) + ' GB' : 'unknown size';
      }

      async function start(resume = false) {
        state.sawReboot = false;
        state.lastJob = null;
        state.mode = null;
        state.plan = null;
        show('<p>Looking at this computer…</p>');
        try {
          if (resume) {
            const job = await api('/api/job');
            if (job.state !== 'idle') {
              state.mode = job.mode;
              state.sawReboot = job.step === 'reboot';
              state.lastJob = job;
              return progress();
            }
          }
          state.scan = await api('/api/scan');
        } catch (e) {
          return show(
            problem(e, () => start(resume), 'looking at this computer')
          );
        }
        home();
      }

      function home() {
        const s = state.scan,
          here = s.here_blockers.length === 0;
        let h =
          '<div class="box">This computer: <b>' +
          esc(s.os) +
          ' ' +
          esc(s.arch) +
          '</b>' +
          (s.node_role
            ? ' — already a <b>' + esc(s.node_role) + '</b> node'
            : '') +
          '</div>';
        if (!s.release.ok) {
          h += trouble({
            message:
              'The installer download cannot be reached: ' + s.release.error,
            fix: s.release.advice,
            guidance: s.release.guidance,
            log: s.log,
            retry: () => start(),
            where: 'checking the installer download',
            noStartOver: true,
          });
          return show(h);
        }
        h += '<h2>What do you want to do?</h2>';
        h +=
          '<button class="primary" id="here" ' +
          (here ? '' : 'disabled') +
          ' onclick="pickHere()">Turn THIS computer into a node</button>';
        if (!here)
          h +=
            '<div class="box">Not possible from here: <ul>' +
            s.here_blockers.map((b) => '<li>' + esc(b) + '</li>').join('') +
            '</ul></div>';
        h +=
          '<br><button class="primary" onclick="pickUsb()">Make an install USB stick for another computer</button>';
        h +=
          '<p><small>The USB stick works for any new or old x86-64 computer: start it from the stick and it installs by itself. ' +
          'Version ' +
          esc(s.version) +
          '. Log: ' +
          esc(s.log || 'none') +
          '</small></p>';
        show(h);
      }

      function pickHere() {
        state.mode = 'here';
        chooseRole();
      }
      function pickUsb() {
        state.mode = 'usb';
        if (state.scan.usb.length === 1) state.usb = state.scan.usb[0].id;
        chooseUsb();
      }

      function chooseRole() {
        const s = state.scan;
        let h = '<h2>What kind of node?</h2>';
        s.roles.forEach((r) => {
          h +=
            '<label class="choice"><input type="radio" name="role" value="' +
            esc(r.id) +
            '"' +
            (state.role === r.id ? ' checked' : '') +
            ' onchange="roleChanged()"' +
            '> <b>' +
            esc(r.title) +
            '</b><small>' +
            esc(r.blurb) +
            '</small></label>';
        });
        if (s.node_role)
          h +=
            '<label class="choice"><input type="checkbox" id="reinstall"> <b>Hard reinstall</b><small>Erase and replace this node even when keeping the same role. Every file on its internal disk will be lost.</small></label>';
        h +=
          '<div id="devbox-access"' +
          (state.role === 'devbox' ? '' : ' hidden') +
          '><h2>Devbox SSH access</h2><p>Select your SSH <b>public</b> key file (usually <code>id_ed25519.pub</code> in your <code>.ssh</code> folder), or paste it below.</p>' +
          '<label for="key-file">SSH public key file</label><input type="file" id="key-file" accept=".pub" onchange="readPublicKey(this)">' +
          '<label for="ssh-key">SSH public key</label><input type="text" id="ssh-key" autocomplete="off" spellcheck="false" placeholder="ssh-ed25519 AAAA…" value="' +
          esc(state.sshKey) +
          '"></div>';
        h +=
          '<p>Enrollment is automatic after the repository owner approves the GitHub page that opens during installation.</p>' +
          '<details><summary>Already have an enrollment token?</summary><p>Paste it here to use it instead of GitHub approval.</p>' +
          '<label for="token">Enrollment token (optional)</label><input type="password" id="token" autocomplete="off" spellcheck="false" placeholder="hvs.… (optional)" value="' +
          esc(state.token) +
          '"></details>';
        h +=
          wifiFields() +
          '<p><button onclick="start()">Back</button><button class="primary" onclick="reviewHere()">Review</button></p>';
        show(h);
      }

      function roleChanged() {
        document.getElementById('devbox-access').hidden =
          picked('role') !== 'devbox';
      }

      function chooseUsb() {
        const s = state.scan;
        let h = '<h2>Which USB stick?</h2>';
        if (!s.usb.length)
          h +=
            '<div class="box">No USB stick found. Plug one in (at least 8 GB), then press Rescan. Everything on it will be erased.</div>';
        s.usb.forEach((u) => {
          h +=
            '<label class="choice"><input type="radio" name="usb" value="' +
            esc(u.id) +
            '"' +
            (state.usb === u.id ? ' checked' : '') +
            '> <b>' +
            esc(u.plain) +
            '</b><small>' +
            esc(u.path) +
            (u.mounted ? ' — in use; it will be released' : '') +
            '</small></label>';
        });
        h +=
          wifiFields() +
          '<p><button onclick="start()">Back</button><button onclick="rescanUsb()">Rescan</button>' +
          '<button class="primary" ' +
          (s.usb.length ? '' : 'disabled') +
          ' onclick="reviewUsb()">Review</button></p>';
        show(h);
      }
      async function rescanUsb() {
        try {
          state.scan = await api('/api/scan');
        } catch (e) {
          return show(problem(e, rescanUsb, 'rescanning USB disks'));
        }
        if (state.scan.usb.length === 1) state.usb = state.scan.usb[0].id;
        chooseUsb();
      }

      function picked(name) {
        const el = document.querySelector('input[name="' + name + '"]:checked');
        return el ? el.value : null;
      }

      async function reviewHere() {
        state.role = picked('role');
        state.token = document.getElementById('token').value.trim();
        state.sshKey = document.getElementById('ssh-key').value.trim();
        if (!state.role) return alert('Choose what kind of node first.');
        review({
          mode: 'here',
          role: state.role,
          token: state.token,
          ssh_key: state.sshKey,
          reinstall: document.getElementById('reinstall')?.checked === true,
          disk_id: state.scan.internal.id,
          wifi: readWifi(),
        });
      }
      async function readPublicKey(input) {
        const file = input.files[0];
        if (!file) return;
        if (file.size > 2048 || !file.name.endsWith('.pub'))
          return alert(
            'Choose the small .pub public key file. Never choose a private key.'
          );
        document.getElementById('ssh-key').value = await file.text();
      }
      async function reviewUsb() {
        state.usb = picked('usb');
        if (!state.usb) return alert('Choose a USB stick first.');
        review({ mode: 'usb', disk_id: state.usb, wifi: readWifi() });
      }

      function wifiFields() {
        const wifi = state.wifi || {};
        return (
          '<p>Saved Wi-Fi settings are carried over automatically when the operating system permits it. Ethernet also works.</p>' +
          '<details><summary>Use a different Wi-Fi network</summary>' +
          '<p>Enter these only to override automatic detection. Wi-Fi settings saved on an install USB include the password; keep the USB private.</p>' +
          '<label for="wifi-ssid">Wi-Fi network name</label><input id="wifi-ssid" autocomplete="off" spellcheck="false" value="' +
          esc(wifi.ssid || '') +
          '">' +
          '<label for="wifi-auth">Wi-Fi security</label><select id="wifi-auth">' +
          [
            ['wpa-psk', 'WPA/WPA2 Personal'],
            ['sae', 'WPA3 Personal'],
            ['open', 'Open network'],
          ]
            .map(
              ([value, label]) =>
                '<option value="' +
                value +
                '"' +
                ((wifi.auth || 'wpa-psk') === value ? ' selected' : '') +
                '>' +
                label +
                '</option>'
            )
            .join('') +
          '</select>' +
          '<label for="wifi-password">Wi-Fi password</label><input id="wifi-password" type="password" autocomplete="new-password" value="' +
          esc(wifi.password || '') +
          '">' +
          '<label><input id="wifi-hidden" type="checkbox"' +
          (wifi.hidden ? ' checked' : '') +
          '> Hidden network</label></details>'
        );
      }

      function readWifi() {
        const ssid = document.getElementById('wifi-ssid').value;
        const password = document.getElementById('wifi-password').value;
        state.wifi =
          ssid || password
            ? {
                ssid,
                password,
                auth: document.getElementById('wifi-auth').value,
                hidden: document.getElementById('wifi-hidden').checked,
              }
            : null;
        return state.wifi;
      }

      async function review(body) {
        state.lastBody = body;
        state.plan = null;
        show('<p>Checking everything…</p>');
        try {
          state.plan = await api('/api/plan', body);
        } catch (e) {
          return show(problem(e, () => review(body), 'review'));
        }
        const p = state.plan;
        let h = '<h2>Review</h2>';
        const attention = p.findings.filter(
          (f) => f.status === 'fail' || f.status === 'warn'
        );
        const automatic = p.findings.filter((f) => f.automatic);
        if (automatic.length)
          h +=
            '<p>The installer will handle this automatically:</p><ul>' +
            automatic.map((f) => '<li>' + esc(f.detail) + '</li>').join('') +
            '</ul>';
        function checkRow(f) {
          const cls =
            f.status === 'fail' ? 'fail' : f.status === 'warn' ? 'warn' : 'ok';
          return (
            '<tr><td class="' +
            cls +
            '">' +
            esc(f.status.toUpperCase()) +
            '</td><td>&nbsp;' +
            esc(f.name) +
            '&nbsp;</td><td>' +
            esc(f.detail) +
            (f.fix && f.status !== 'ok'
              ? '<br><small>' + esc(f.fix) + '</small>'
              : '') +
            '</td></tr>'
          );
        }
        if (attention.length)
          h += '<table>' + attention.map(checkRow).join('') + '</table>';
        const passed = p.findings.filter(
          (f) => f.status !== 'fail' && f.status !== 'warn'
        );
        h +=
          '<details><summary>Automatic checks (' +
          passed.length +
          ')</summary><table>' +
          passed.map(checkRow).join('') +
          '</table></details>';
        if (!p.ready) {
          h +=
            '<p class="fail">This needs your attention before installation can continue.</p><button onclick="start()">Start over</button><button class="primary" onclick="review(' +
            esc(JSON.stringify(body)) +
            ')">Check again</button>';
          return show(h);
        }
        h += '<div class="erase"><b>' + esc(p.summary) + '</b></div>';
        h +=
          '<label><input type="checkbox" id="ack"> I understand that <b>' +
          esc(p.erase) +
          '</b> will be erased.</label>';
        h +=
          '<p><button onclick="start()">Cancel</button><button class="danger" onclick="go()">Erase and install</button></p>';
        show(h);
      }

      async function go() {
        if (!document.getElementById('ack').checked)
          return alert('Tick the box to confirm.');
        try {
          await api('/api/run', {
            plan_id: state.plan.id,
            ack: true,
            disk_id: state.plan.disk_id,
          });
        } catch (e) {
          const body = state.lastBody;
          return show(
            problem(e, body ? () => review(body) : null, 'starting the install')
          );
        }
        state.wifi = null;
        progress();
      }

      async function progress() {
        let j;
        try {
          j = await api('/api/job');
        } catch (e) {
          if (state.mode === 'here' && state.sawReboot)
            return show(
              '<h2>Waiting for the new node</h2><p>The connection closed during restart. Installation is not yet confirmed. Fleet will show the node after it boots and reports.</p>' +
                '<p><a href="https://fleet.chrisvouga.dev/nodes" target="_blank" rel="noreferrer">Monitor in Fleet</a></p>' +
                diagnostics(state.lastJob)
            );
          return show(
            '<h2 class="fail">Connection lost — installation is not confirmed</h2>' +
              trouble({
                message: e.message,
                fix: e.fix,
                guidance: {
                  steps: [
                    'Do not start another erase yet: a disk operation may still be running.',
                    e.fix ||
                      'Check that the Fleet installer is still running, then press Reconnect to this job.',
                  ],
                },
                job: state.lastJob,
                retry: progress,
                retryLabel: 'Reconnect to this job',
                where: 'following the install job',
              })
          );
        }
        state.lastJob = j;
        if (j.step === 'reboot') state.sawReboot = true;
        if (
          j.state === 'done' ||
          j.state === 'failed' ||
          j.state === 'cancelled'
        )
          return finish(j);
        let h =
          '<h2>Working…</h2><p>' +
          esc(j.message) +
          '</p><progress max=100 ' +
          (j.percent == null ? '' : 'value="' + j.percent + '"') +
          '></progress>';
        // The server allows Cancel until the administrator step claims its work,
        // including while the permission prompt is still open.
        if (j.cancellable ?? j.state === 'downloading')
          h += '<p><button onclick="cancelBeforeWrite()">Cancel</button></p>';
        h += '<pre>' + esc(j.log.join('\n')) + '</pre>';
        show(h);
        setTimeout(progress, 600);
      }

      async function cancelBeforeWrite() {
        try {
          await api('/api/cancel', {});
        } catch (e) {
          alert(e.message + (e.fix ? '\n' + e.fix : ''));
        }
      }

      function finish(j) {
        const r = j.result || {};
        let h;
        if (j.state === 'done') {
          h =
            '<h2 class="ok">' +
            (state.mode === 'here'
              ? 'Restart scheduled — Fleet confirmation pending'
              : 'USB ready') +
            '</h2><p>' +
            esc(r.message) +
            '</p>';
          if (state.mode === 'here')
            h +=
              '<p><a href="https://fleet.chrisvouga.dev/nodes" target="_blank" rel="noreferrer">Monitor in Fleet</a></p>';
          if (state.mode === 'usb')
            h +=
              '<h2>Next</h2><ol><li>Plug the stick into the new computer and start it from the stick (usually F12, F11, Esc or Option at power-on).</li>' +
              '<li>Choose ci, web, cache, netboot or devbox in the installer menu, then press Enter. The menu waits for your choice; every entry erases the internal disk. A devbox asks for your SSH public key before erasing anything; paste your .pub file contents at that prompt.</li>' +
              "<li>It erases the computer's internal disk and installs by itself. Remove the stick when it says so.</li></ol>";
        } else {
          const body = state.lastBody;
          h =
            '<h2 class="fail">' +
            (j.state === 'cancelled' ? 'Cancelled' : 'It did not finish') +
            '</h2>' +
            trouble({
              message: r.message,
              fix: r.fix,
              guidance: r.guidance,
              log: r.log,
              job: j,
              retry: body ? () => review(body) : () => start(),
            });
          return show(h);
        }
        if (r.log) h += '<p><small>Log: ' + esc(r.log) + '</small></p>';
        h += diagnostics(j);
        h += '<button onclick="start()">Start over</button>';
        show(h);
      }
      // Details for a finished or unconfirmed job that did not fail.
      function diagnostics(j) {
        const r = j?.result || {};
        state.problem = null;
        state.report = fallbackReport({
          job: j,
          message: r.message,
          fix:
            r.fix ||
            'Check this node in Fleet. Do not repeat an erase while a disk operation is still running.',
          log: r.log,
        });
        state.issueUrl = null;
        loadDiagnostic();
        return (
          '<details><summary>Error details for support or an LLM</summary><textarea id="diagnostic-report" readonly rows="12"></textarea><p><button onclick="copyDiagnostic()">Copy diagnostic report</button>' +
          '<button onclick="reportIssue()">Report on GitHub</button></p><p id="diagnostic-status" role="status"></p></details>'
        );
      }
      start(true);
    </script>
  </body>
</html>
