<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fleet installer</title>
    <style>
      body {
        font:
          16px/1.5 system-ui,
          sans-serif;
        max-width: 46rem;
        margin: 2rem auto;
        padding: 0 1rem;
        color: #111;
      }
      h1 {
        font-size: 1.5rem;
      }
      h2 {
        font-size: 1.15rem;
        margin-top: 1.5rem;
      }
      button {
        font: inherit;
        padding: 0.6rem 1rem;
        margin: 0.3rem 0.3rem 0.3rem 0;
        cursor: pointer;
      }
      button.primary {
        background: #0b57d0;
        color: #fff;
        border: 0;
        border-radius: 4px;
      }
      button.danger {
        background: #b3261e;
        color: #fff;
        border: 0;
        border-radius: 4px;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      label.choice {
        display: block;
        border: 1px solid #bbb;
        border-radius: 4px;
        padding: 0.6rem 0.8rem;
        margin: 0.4rem 0;
      }
      label.choice small {
        display: block;
        color: #555;
      }
      .fail {
        color: #b3261e;
        font-weight: 600;
      }
      .warn {
        color: #8a5a00;
        font-weight: 600;
      }
      .ok {
        color: #1a6b2a;
      }
      .box {
        background: #f3f3f3;
        border-radius: 4px;
        padding: 0.7rem 0.9rem;
        margin: 0.6rem 0;
      }
      .erase {
        background: #fdecea;
        border: 2px solid #b3261e;
        border-radius: 4px;
        padding: 0.7rem 0.9rem;
        margin: 0.8rem 0;
      }
      progress {
        width: 100%;
        height: 1.4rem;
      }
      pre {
        background: #111;
        color: #ddd;
        padding: 0.6rem;
        max-height: 12rem;
        overflow: auto;
        font-size: 0.8rem;
      }
      input[type='text'] {
        font: inherit;
        width: 100%;
        padding: 0.4rem;
        box-sizing: border-box;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>Fleet installer</h1>
    <noscript><p class="fail">This page needs JavaScript.</p></noscript>
    <div id="app"><p>Looking at this computer…</p></div>

    <script>
      'use strict';
      const TOKEN =
        new URLSearchParams(location.search).get('t') ||
        sessionStorage.getItem('fleet-token') ||
        '';
      if (TOKEN) sessionStorage.setItem('fleet-token', TOKEN);
      history.replaceState(null, '', location.pathname);
      const state = {
        scan: null,
        mode: null,
        role: null,
        usb: null,
        token: '',
        plan: null,
        sshKey: '',
        sawWorking: false,
      };
      const app = document.getElementById('app');

      async function api(path, body) {
        const res = await fetch(path, {
          method: body === undefined ? 'GET' : 'POST',
          headers: {
            'X-Fleet-Token': TOKEN,
            'Content-Type': 'application/json',
          },
          body: body === undefined ? undefined : JSON.stringify(body),
        });
        let data = {};
        try {
          data = await res.json();
        } catch (e) {
          /* not JSON */
        }
        if (!res.ok) {
          const err = new Error(data.error || 'HTTP ' + res.status);
          err.fix = data.fix;
          throw err;
        }
        return data;
      }
      function esc(s) {
        return String(s == null ? '' : s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
              "'": '&#39;',
            })[c]
        );
      }
      function show(html) {
        app.innerHTML = html;
      }
      function problem(err) {
        return (
          '<div class="box"><p class="fail">' +
          esc(err.message) +
          '</p>' +
          (err.fix ? '<p>' + esc(err.fix) + '</p>' : '') +
          '<button onclick="start()">Start over</button></div>'
        );
      }
      function gb(n) {
        return n ? (n / 1e9).toFixed(1) + ' GB' : 'unknown size';
      }

      async function start() {
        state.sawWorking = false;
        state.plan = null;
        show('<p>Looking at this computer…</p>');
        try {
          state.scan = await api('/api/scan');
        } catch (e) {
          return show(problem(e));
        }
        home();
      }

      function home() {
        const s = state.scan,
          here = s.here_blockers.length === 0;
        let h =
          '<div class="box">This computer: <b>' +
          esc(s.os) +
          ' ' +
          esc(s.arch) +
          '</b>' +
          (s.node_role
            ? ' — already a <b>' + esc(s.node_role) + '</b> node'
            : '') +
          '</div>';
        if (!s.release.ok) {
          h +=
            '<p class="fail">The installer download cannot be reached: ' +
            esc(s.release.error) +
            '</p>' +
            "<p>Check this computer's internet connection. If the network is fine, the installer has not been published yet.</p>" +
            '<button onclick="start()">Try again</button>';
          return show(h);
        }
        h += '<h2>What do you want to do?</h2>';
        h +=
          '<button class="primary" id="here" ' +
          (here ? '' : 'disabled') +
          ' onclick="pickHere()">Turn THIS computer into a node</button>';
        if (!here)
          h +=
            '<div class="box">Not possible from here: <ul>' +
            s.here_blockers.map((b) => '<li>' + esc(b) + '</li>').join('') +
            '</ul></div>';
        h +=
          '<br><button class="primary" onclick="pickUsb()">Make an install USB stick for another computer</button>';
        h +=
          '<p><small>The USB stick works for any new or old x86-64 computer: start it from the stick and it installs by itself. ' +
          'Version ' +
          esc(s.version) +
          '. Log: ' +
          esc(s.log || 'none') +
          '</small></p>';
        show(h);
      }

      function pickHere() {
        state.mode = 'here';
        chooseRole();
      }
      function pickUsb() {
        state.mode = 'usb';
        chooseUsb();
      }

      function chooseRole() {
        const s = state.scan;
        let h = '<h2>What kind of node?</h2>';
        s.roles.forEach((r) => {
          h +=
            '<label class="choice"><input type="radio" name="role" value="' +
            esc(r.id) +
            '"' +
            (state.role === r.id ? ' checked' : '') +
            '> <b>' +
            esc(r.title) +
            '</b><small>' +
            esc(r.blurb) +
            '</small></label>';
        });
        h +=
          '<h2>Devbox SSH access</h2><p>If you choose Remote devbox, select your SSH <b>public</b> key file (usually <code>id_ed25519.pub</code> in your <code>.ssh</code> folder), or paste its contents below. Keep the private key on the computer you will connect from.</p>' +
          '<input type="file" id="key-file" accept=".pub" onchange="readPublicKey(this)">' +
          '<input type="text" id="ssh-key" autocomplete="off" spellcheck="false" placeholder="ssh-ed25519 AAAA…" value="' +
          esc(state.sshKey) +
          '">';
        h +=
          '<h2>Enrollment</h2><p>After you press <b>Erase and install</b>, a GitHub page opens. Press <b>Submit new issue</b> on it, signed in as the repository owner; that approves this computer and gives it the secrets the other nodes of its kind share. ' +
          'Nothing is erased until it is approved. Already have a token from <code>just enroll &lt;kind&gt;</code>? Paste it here to skip the approval.</p>' +
          '<input type="text" id="token" autocomplete="off" spellcheck="false" placeholder="hvs.… (optional)" value="' +
          esc(state.token) +
          '">';
        h +=
          '<p><button onclick="start()">Back</button><button class="primary" onclick="reviewHere()">Review</button></p>';
        show(h);
      }

      function chooseUsb() {
        const s = state.scan;
        let h = '<h2>Which USB stick?</h2>';
        if (!s.usb.length)
          h +=
            '<div class="box">No USB stick found. Plug one in (at least 8 GB), then press Rescan. Everything on it will be erased.</div>';
        s.usb.forEach((u) => {
          h +=
            '<label class="choice"><input type="radio" name="usb" value="' +
            esc(u.id) +
            '"' +
            (state.usb === u.id ? ' checked' : '') +
            '> <b>' +
            esc(u.plain) +
            '</b><small>' +
            esc(u.path) +
            (u.mounted ? ' — in use; it will be released' : '') +
            '</small></label>';
        });
        h +=
          '<p><button onclick="start()">Back</button><button onclick="rescanUsb()">Rescan</button>' +
          '<button class="primary" ' +
          (s.usb.length ? '' : 'disabled') +
          ' onclick="reviewUsb()">Review</button></p>';
        show(h);
      }
      async function rescanUsb() {
        try {
          state.scan = await api('/api/scan');
        } catch (e) {
          return show(problem(e));
        }
        chooseUsb();
      }

      function picked(name) {
        const el = document.querySelector('input[name="' + name + '"]:checked');
        return el ? el.value : null;
      }

      async function reviewHere() {
        state.role = picked('role');
        state.token = document.getElementById('token').value.trim();
        state.sshKey = document.getElementById('ssh-key').value.trim();
        if (!state.role) return alert('Choose what kind of node first.');
        review({
          mode: 'here',
          role: state.role,
          token: state.token,
          ssh_key: state.sshKey,
          disk_id: state.scan.internal.id,
        });
      }
      async function readPublicKey(input) {
        const file = input.files[0];
        if (!file) return;
        if (file.size > 2048 || !file.name.endsWith('.pub'))
          return alert(
            'Choose the small .pub public key file. Never choose a private key.'
          );
        document.getElementById('ssh-key').value = await file.text();
      }
      async function reviewUsb() {
        state.usb = picked('usb');
        if (!state.usb) return alert('Choose a USB stick first.');
        review({ mode: 'usb', disk_id: state.usb });
      }

      async function review(body) {
        show('<p>Checking everything…</p>');
        try {
          state.plan = await api('/api/plan', body);
        } catch (e) {
          return show(problem(e));
        }
        const p = state.plan;
        let h = '<h2>Review</h2><table>';
        p.findings.forEach((f) => {
          const cls =
            f.status === 'fail' ? 'fail' : f.status === 'warn' ? 'warn' : 'ok';
          h +=
            '<tr><td class="' +
            cls +
            '">' +
            esc(f.status.toUpperCase()) +
            '</td><td>&nbsp;' +
            esc(f.name) +
            '&nbsp;</td><td>' +
            esc(f.detail) +
            (f.fix && f.status !== 'ok'
              ? '<br><small>' + esc(f.fix) + '</small>'
              : '') +
            '</td></tr>';
        });
        h += '</table>';
        if (!p.ready) {
          h +=
            '<p class="fail">Fix the items marked FAIL, then check again.</p><button onclick="start()">Start over</button><button class="primary" onclick="review(' +
            esc(JSON.stringify(body)) +
            ')">Check again</button>';
          return show(h);
        }
        h += '<div class="erase"><b>' + esc(p.summary) + '</b></div>';
        h +=
          '<label><input type="checkbox" id="ack"> I understand that <b>' +
          esc(p.erase) +
          '</b> will be erased.</label>';
        h +=
          '<p><button onclick="start()">Cancel</button><button class="danger" onclick="go()">Erase and install</button></p>';
        show(h);
      }

      async function go() {
        if (!document.getElementById('ack').checked)
          return alert('Tick the box to confirm.');
        try {
          await api('/api/run', {
            plan_id: state.plan.id,
            ack: true,
            disk_id: state.plan.disk_id,
          });
        } catch (e) {
          return show(problem(e));
        }
        progress();
      }

      async function progress() {
        let j;
        try {
          j = await api('/api/job');
        } catch (e) {
          if (state.mode === 'here' && state.sawWorking)
            return show(
              '<h2>Restarting</h2><p>This computer is restarting into the installer. This page stops responding now; that is expected. ' +
                'The installer erases the disk and installs by itself, then restarts into the new node. It takes several minutes and needs nothing from you.</p>'
            );
          return show(problem(e));
        }
        if (j.state === 'working') state.sawWorking = true;
        if (
          j.state === 'done' ||
          j.state === 'failed' ||
          j.state === 'cancelled'
        )
          return finish(j);
        let h =
          '<h2>Working…</h2><p>' +
          esc(j.message) +
          '</p><progress max=100 ' +
          (j.percent == null ? '' : 'value="' + j.percent + '"') +
          '></progress>';
        if (j.state === 'downloading')
          h += '<p><button onclick="cancelBeforeWrite()">Cancel</button></p>';
        h += '<pre>' + esc(j.log.join('\n')) + '</pre>';
        show(h);
        setTimeout(progress, 600);
      }

      async function cancelBeforeWrite() {
        try {
          await api('/api/cancel', {});
        } catch (e) {
          alert(e.message + (e.fix ? '\n' + e.fix : ''));
        }
      }

      function finish(j) {
        const r = j.result || {};
        let h;
        if (j.state === 'done') {
          h = '<h2 class="ok">Done</h2><p>' + esc(r.message) + '</p>';
          if (state.mode === 'usb')
            h +=
              '<h2>Next</h2><ol><li>Plug the stick into the new computer and start it from the stick (usually F12, F11, Esc or Option at power-on).</li>' +
              '<li>Choose ci, web, cache, netboot or devbox in the installer menu, then press Enter. The menu waits for your choice; every entry erases the internal disk. A devbox asks for your SSH public key before erasing anything; paste your .pub file contents at that prompt.</li>' +
              "<li>It erases the computer's internal disk and installs by itself. Remove the stick when it says so.</li></ol>";
        } else {
          h =
            '<h2 class="fail">' +
            (j.state === 'cancelled' ? 'Cancelled' : 'It did not finish') +
            '</h2><p class="fail">' +
            esc(r.message) +
            '</p>' +
            (r.fix ? '<p>' + esc(r.fix) + '</p>' : '');
        }
        if (r.log) h += '<p><small>Log: ' + esc(r.log) + '</small></p>';
        h += '<button onclick="start()">Start over</button>';
        show(h);
      }
      start();
    </script>
  </body>
</html>
