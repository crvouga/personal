---
- name: Enable recovery for an already verified T3 desktop app
  hosts: localhost
  connection: local
  become: true
  gather_facts: false
  tasks:
    - name: Verify the desktop unit runs before adding any recovery trigger
      ansible.builtin.command:
        argv: [systemctl, --user, is-active, t3code-desktop.service]
      become_user: '{{ development_user }}'
      environment:
        XDG_RUNTIME_DIR: '/run/user/{{ development_uid }}'
      changed_when: false
    - ansible.builtin.import_tasks: tasks/recovery.yml
