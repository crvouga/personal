---
- name: Declare bounded recovery of the worker T3 desktop app
  ansible.builtin.copy:
    dest: '{{ development_home }}/.config/systemd/user/personal-worker-recovery.service'
    owner: '{{ development_user }}'
    mode: '0600'
    content: |
      # Managed by personal fleet-sync: packages/fleet/ubuntu/t3-health.sh
      [Unit]
      Description=Keep the worker T3 desktop app running and responsive
      [Service]
      Type=oneshot
      ExecStart=/bin/sh {{ development_source }}/packages/fleet/ubuntu/t3-health.sh
      TimeoutStartSec=90
- name: Declare persistent service recovery checks
  ansible.builtin.copy:
    dest: '{{ development_home }}/.config/systemd/user/personal-worker-recovery.timer'
    owner: '{{ development_user }}'
    mode: '0600'
    content: |
      [Unit]
      Description=Check the worker T3 desktop app every minute
      [Timer]
      OnBootSec=1min
      OnUnitActiveSec=1min
      Persistent=true
      [Install]
      WantedBy=timers.target
- name: Enable bounded T3 recovery without restarting active sessions
  become: true
  become_user: '{{ development_user }}'
  environment:
    XDG_RUNTIME_DIR: '/run/user/{{ development_uid }}'
  ansible.builtin.systemd_service:
    scope: user
    name: personal-worker-recovery.timer
    daemon_reload: true
    enabled: true
    state: started
