# Presentations (src/roles/) are plain static pages at `/a/<id>/`. The
# old `?role=<id>` links redirect there. Only a value shaped like an id
# is passed on, so the parameter can never name a path; an id that was not
# built fails the file check below and the default is served.
map $arg_role $role {
    default "";
    "~^[a-z0-9-]{1,64}$" $arg_role;
}

server {
    listen 80;
    server_name localhost;
    # Redirects (e.g. /projects → /projects/) are relative, so behind the TLS
    # edge they stay on https instead of bouncing through http://.
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    error_log /tmp/nginx-error.log warn;
    access_log /tmp/nginx-access.log;

    # Text assets are pre-compressed to .gz in the Docker build stage, so
    # gzip_static serves them without per-request work; `gzip` covers any
    # text file that was not. The nginx:alpine image has no Brotli module.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # Railway's edge proxies every request; compress for it unconditionally.
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/manifest+json image/svg+xml;

    charset utf-8;
    charset_types text/plain text/css text/xml application/javascript application/json application/manifest+json;

    include /etc/nginx/snippets/security-headers.conf;

    # Not in nginx's mime.types; must come before the static-asset regex.
    location ~* \.webmanifest$ {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Astro's bundles carry a content hash in their names, so a change is a new
    # URL and they can be cached for a year. `^~` wins over the regex below.
    location ^~ /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
        try_files $uri =404;
    }

    # Everything else in public/ keeps a stable name (screenshots, fonts, the
    # favicon), so it must be able to change: a day, then revalidate. The share
    # card's URL carries ?v=<hash>, so platforms still never see a stale one.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        access_log off;
        try_files $uri =404;
    }

    # The static Storybook (src/**/*.stories.ts). Its own headers: its preview
    # is a same-origin iframe and its inline scripts are not in the site's CSP
    # hashes. `^~` keeps the static-asset regex below from taking its files.
    location ^~ /storybook/ {
        include /etc/nginx/snippets/storybook-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # The resume is rebuilt from content on every deploy, so it must never be
    # served from cache without revalidating — a recruiter would get the copy
    # from whenever they last opened the site.
    location = /chris-vouga-resume.pdf {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        # Old `?role=<id>` link: send it to that role's résumé.
        if (-f $document_root/a/$role/chris-vouga-resume.pdf) {
            return 302 /a/$role/chris-vouga-resume.pdf;
        }
        try_files $uri =404;
    }

    # Old `?role=<id>` link: send it to that presentation's path. With no
    # parameter, or one that matches no built role, the default is served.
    location = / {
        if (-f $document_root/a/$role/index.html) {
            return 302 /a/$role/;
        }
        try_files /index.html =404;
    }

    # No SPA fallback: this is a multi-route static site, so an unknown path
    # must 404 rather than silently serving the homepage with a 200.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
