server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    error_log /tmp/nginx-error.log warn;
    access_log /tmp/nginx-access.log;

    # Text assets are pre-compressed to .gz in the Docker build stage, so
    # gzip_static serves them without per-request work; `gzip` covers any
    # text file that was not. The nginx:alpine image has no Brotli module.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # Railway's edge proxies every request; compress for it unconditionally.
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/manifest+json image/svg+xml;

    charset utf-8;
    charset_types text/plain text/css text/xml application/javascript application/json application/manifest+json;

    include /etc/nginx/snippets/security-headers.conf;

    # Not in nginx's mime.types; must come before the static-asset regex.
    location ~* \.webmanifest$ {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Static assets keep a year-long immutable cache. Must come before location /.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
        try_files $uri =404;
    }

    # The resume is rebuilt from content on every deploy, so it must never be
    # served from cache without revalidating — a recruiter would get the copy
    # from whenever they last opened the site.
    location = /chris-vouga-resume.pdf {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # No SPA fallback: this is a multi-route static site, so an unknown path
    # must 404 rather than silently serving the homepage with a 200.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
