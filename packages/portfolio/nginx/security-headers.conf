# Security headers for every response. nginx drops all inherited add_header
# directives in any block that declares its own, so nginx.conf includes this
# file at server level AND in every location with an add_header. `always`
# keeps the headers on 404s and other error responses.

# Content-Security-Policy, generated at build time by scripts/csp.ts with the
# sha256 of every inline script and style in dist/**/*.html.
include /etc/nginx/snippets/csp-header.conf;

# No includeSubDomains/preload: links.resend.chrisvouga.dev (Resend click
# tracking) is HTTP-only behind Cloudflare, and preloading the registrable
# domain would break every tracked email link. The edge sends no HSTS itself.
add_header Strict-Transport-Security "max-age=63072000" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Superseded by CSP frame-ancestors 'none'; kept for browsers without CSP 2.
add_header X-Frame-Options "DENY" always;
