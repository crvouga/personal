name: cliproxy-fleet
services:
  proxy:
    image: ${CLI_PROXY_IMAGE:?image must be pinned}
    restart: unless-stopped
    user: '${CLIPROXY_UID:-1000}:${CLIPROXY_GID:-1000}'
    working_dir: /state
    command: ['/CLIProxyAPI/CLIProxyAPI', '-config', '/state/config.yaml']
    environment:
      HOME: /state
      TZ: UTC
      MANAGEMENT_STATIC_PATH: /state/static
    ports:
      - '127.0.0.1:8317:8317'
    volumes:
      - ./state/runtime:/state
      - ./scripts/container-health:/health:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    stop_grace_period: 45s
    healthcheck:
      test: ['CMD', '/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: '10m'
        max-file: '3'
  tailnet:
    profiles: [portable-endpoint]
    user: '${CLIPROXY_UID:-1000}:${CLIPROXY_GID:-1000}'
    image: ${TAILSCALE_IMAGE:?image must be pinned}
    restart: unless-stopped
    entrypoint: ['/usr/local/bin/tailscaled']
    command:
      [
        '--tun=userspace-networking',
        '--state=/var/lib/tailscale/tailscaled.state',
        '--socket=/tmp/tailscaled.sock',
      ]
    volumes:
      - ./state/tailscale:/var/lib/tailscale
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    logging:
      driver: local
      options:
        max-size: '5m'
        max-file: '2'
  cloudflared:
    profiles: [public-endpoint]
    image: ${CLOUDFLARED_IMAGE:?image must be pinned}
    user: '${CLIPROXY_UID:-1000}:${CLIPROXY_GID:-1000}'
    restart: unless-stopped
    command:
      [
        'tunnel',
        '--no-autoupdate',
        'run',
        '--token-file',
        '/run/secrets/tunnel-token',
      ]
    volumes:
      - ./state/secrets/tunnel-token:/run/secrets/tunnel-token:ro
    depends_on:
      proxy:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    logging:
      driver: local
      options:
        max-size: '5m'
        max-file: '2'
