# Version updates. The bot owns dependency bumps; agents never bump dependencies.
# PRs are labeled `deps` and auto-merged by agent-prs.yml once CI is green.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [deps]
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint does not support TypeScript 7, and TS 7 drops the
      # compiler API scripts/iac-policy.test.ts uses. Lift this once
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940 ships.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      bun:
        patterns: ['*']
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/*]
    schedule:
      interval: weekly
      day: monday
    labels: [deps]
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ['*']
