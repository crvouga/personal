name: OpenTofu
description: Initialize, plan and apply one OpenTofu root with encrypted R2 state.
inputs:
  root:
    required: true
    description: OpenTofu root (foundation, bootstrap, vault, services, auth-hosting or auth)
  state_key:
    default: ''
    description: State object name without .tfstate; defaults to the root except services retains its existing shared backend key. The auth root uses one state per instance (auth-production, auth-nonproduction).
  vault_image_tag:
    default: ''
    description: New vault image revision; empty preserves the deployed revision.
  service_ids:
    default: '[]'
    description: JSON array of services receiving a new image revision.
  image_tag:
    default: ''
    description: Image revision for service_ids; empty preserves all revisions.
  mode:
    default: apply
    description: apply plans and applies; prepare only initializes and resolves inputs, for read-only drift checks.
outputs:
  changed_resources:
    description: JSON addresses of managed resources changed by the reviewed saved plan; empty for prepare mode.
    value: ${{ steps.plan.outputs.changed_resources }}
runs:
  using: composite
  steps:
    - name: Require completed state adoption
      shell: bash
      run: |
        if [ "${TOFU_MIGRATION_READY:-false}" != true ]; then
          echo "::error::Import and verify every OpenTofu root before enabling TOFU_MIGRATION_READY."
          exit 1
        fi
    - name: Check installed OpenTofu
      id: toolchain
      shell: bash
      run: |
        if command -v tofu >/dev/null && [ "$(tofu version -json | jq -r .terraform_version)" = 1.13.0 ]; then
          echo 'tofu_ready=true' >> "$GITHUB_OUTPUT"
        fi
    - uses: opentofu/setup-opentofu@v1
      if: steps.toolchain.outputs.tofu_ready != 'true'
      with:
        tofu_version: 1.13.0
        tofu_wrapper: false
    - uses: ariga/setup-atlas@v0
      if: inputs.root == 'foundation' && env.CI_ATLAS_READY != 'true'
    - name: Remember Atlas setup for this job
      if: inputs.root == 'foundation'
      shell: bash
      run: echo 'CI_ATLAS_READY=true' >> "$GITHUB_ENV"
    - name: Configure backend and inputs
      shell: bash
      env:
        TOFU_ROOT: ${{ inputs.root }}
        TOFU_MODE: ${{ inputs.mode }}
        TOFU_STATE_KEY: ${{ inputs.state_key }}
      run: |
        set -euo pipefail
        case "${TOFU_ROOT}" in foundation|bootstrap|vault|services|auth-hosting|auth) ;; *) exit 1 ;; esac
        if [ "${TOFU_ROOT}" = services ] && [ -z "${TOFU_STATE_KEY}" ]; then
          TOFU_STATE_KEY=fleet
        fi
        case "${TOFU_STATE_KEY:-${TOFU_ROOT}}" in *[!a-z-]*) exit 1 ;; esac
        case "${TOFU_MODE}" in apply|prepare) ;; *) exit 1 ;; esac
        ROOT="packages/infra/tofu/${TOFU_ROOT}"
        umask 077
        jq -n --arg account "${TF_VAR_cloudflare_account_id}" '{
          bucket: "crvouga-tofu-state", region: "auto",
          endpoints: {s3: ("https://" + $account + ".r2.cloudflarestorage.com")},
          skip_credentials_validation: true, skip_region_validation: true,
          skip_requesting_account_id: true, skip_metadata_api_check: true,
          use_path_style: true, use_lockfile: true
        }' > /tmp/tofu-backend.json
        echo "TF_VAR_state_backend=$(cat /tmp/tofu-backend.json | jq -c .)" >> "$GITHUB_ENV"
        jq --arg key "${TOFU_STATE_KEY:-${TOFU_ROOT}}.tfstate" '. + {key: $key}' /tmp/tofu-backend.json > "${ROOT}/backend.backend.json"
        if [ "${TOFU_ROOT}" = vault ]; then
          test -n "${TOFU_VAULT_INPUTS}"
          printf '%s' "${TOFU_VAULT_INPUTS}" > "${ROOT}/inputs.auto.tfvars.json"
        elif [ "${TOFU_ROOT}" = foundation ]; then
          echo "TF_VAR_migration_ready=${TOFU_MIGRATION_READY}" >> "$GITHUB_ENV"
        fi
    - name: Initialize
      shell: bash
      env:
        TOFU_ROOT: ${{ inputs.root }}
      run: tofu -chdir="packages/infra/tofu/${TOFU_ROOT}" init -input=false -reconfigure -lockfile=readonly -backend-config=backend.backend.json
    - name: Preserve deployed image revisions
      shell: bash
      env:
        TOFU_ROOT: ${{ inputs.root }}
        VAULT_IMAGE_TAG: ${{ inputs.vault_image_tag }}
        SERVICE_IDS: ${{ inputs.service_ids }}
        IMAGE_TAG: ${{ inputs.image_tag }}
      run: |
        set -euo pipefail
        ROOT="packages/infra/tofu/${TOFU_ROOT}"
        if [ "${TOFU_ROOT}" = foundation ]; then
          TAG="${VAULT_IMAGE_TAG}"
          if [ -z "${TAG}" ]; then TAG="$(tofu -chdir="${ROOT}" output -raw vault_image_tag)"; fi
          echo "TF_VAR_vault_image_tag=${TAG}" >> "$GITHUB_ENV"
        elif [ "${TOFU_ROOT}" = services ]; then
          tofu -chdir="${ROOT}" output -json image_tags > /tmp/tofu-image-tags.json
          # A service added to the inventory has no output yet (nothing is deployed
          # to preserve): use its reviewed initial revision, or the legacy default.
          jq -c --argjson ids "${SERVICE_IDS}" --arg tag "${IMAGE_TAG}" \
            --slurpfile inventory packages/infra/tofu/modules/inventory/inventory.tf.json \
            '$inventory[0].locals.inventory as $inv
             | reduce ($inv.services[] | select((.kind // "railway") == "railway" and ((.standalone // false) | not))) as $service
                 (. ; $service.id as $id | if has($id) then . else .[$id] = ($service.initial_image_tag // $inv.default_image_tag) end)
             | if $tag == "" then . else reduce $ids[] as $id (. ; .[$id] = $tag) end' \
            /tmp/tofu-image-tags.json > /tmp/tofu-next-tags.json
          echo "TF_VAR_image_tags=$(cat /tmp/tofu-next-tags.json)" >> "$GITHUB_ENV"
        fi
    # Atlas inspects search_path during planning, before depends_on is applied.
    # Bootstrap only the empty schema, then let the normal full plan own tables.
    - name: Ensure application schemas exist before Atlas planning
      if: inputs.mode == 'apply' && inputs.root == 'foundation'
      shell: bash
      run: |
        set -euo pipefail
        ROOT="packages/infra/tofu/foundation"
        # Bootstrap is only for first adoption. A targeted plan on an existing
        # installation can exclude moved resources and block ownership handoffs.
        bootstrap() {
          local plan="$1" allowed="$2"; shift 2
          tofu -chdir="${ROOT}" plan -input=false -lock-timeout=15m -parallelism=1 "$@" -out="${plan}"
          tofu -chdir="${ROOT}" show -json "${plan}" | jq -e --arg allowed "${allowed}" '
            all((.resource_changes // [])[];
              .mode == "data" or .change.actions == ["no-op"] or
              ((.address | test($allowed)) and .change.actions == ["create"]))
          ' > /dev/null || {
            echo "::error::Schema bootstrap may only create ${allowed}; review dependency changes separately."
            exit 1
          }
          tofu -chdir="${ROOT}" apply -input=false -lock-timeout=15m -parallelism=1 "${plan}"
        }
        STATE="$(tofu -chdir="${ROOT}" state list || true)"
        # The auth relay's per-instance schemas (and their restricted roles) follow
        # the same rule, and only while the inventory enables the relay.
        INVENTORY="${TOFU_INVENTORY:-packages/infra/tofu/modules/inventory/inventory.tf.json}"
        if [ "$(jq -r '.locals.inventory.auth_relay.enabled' "${INVENTORY}")" = true ] && \
           ! grep -q '^postgresql_schema.auth_console\[' <<< "${STATE}"; then
          bootstrap auth-schemas.tfplan '^(postgresql_schema\.auth_(relay|console)\[.*\]|planetscale_postgres_branch_role\.auth_(relay|console)\[.*\])$' \
            -target=postgresql_schema.auth_relay -target=postgresql_schema.auth_console
        else
          echo "Auth relay schemas are disabled or already managed."
        fi
    # The provider created each volume-backed service (Fleet, Zoomies) and its
    # volume, then returned a null volume read-back, so OpenTofu saved the live
    # service as tainted and every plan since wants to replace it (blocked by
    # prevent_destroy). Untaint only these addresses; the ordinary plan below
    # still reviews any real difference.
    - name: Untaint volume-backed services created with an inconsistent provider result
      if: inputs.mode == 'apply' && inputs.root == 'services'
      shell: bash
      run: |
        set -euo pipefail
        ROOT=packages/infra/tofu/services
        for SERVICE in fleet-controller zoomies; do
          ADDRESS="module.service[\"${SERVICE}\"].railway_service.this"
          if tofu -chdir="${ROOT}" show -json | jq -e --arg address "${ADDRESS}" '
            def resources: .resources[]?, (.child_modules[]? | resources);
            [.values.root_module | resources | select(.address == $address and .tainted == true)] | length == 1
          ' > /dev/null; then
            tofu -chdir="${ROOT}" untaint -lock-timeout=15m "${ADDRESS}"
          else
            echo "${SERVICE} service is not tainted."
          fi
        done
    # One-time recovery of the domain Railway already cascade-deleted. The
    # provider errors on refresh of the absent object; never disable refresh
    # on the ordinary deployment plan below.
    - name: Recover absent retired domain state
      if: inputs.mode == 'apply' && inputs.root == 'services'
      shell: bash
      run: |
        set -euo pipefail
        ROOT=packages/infra/tofu/services
        STATE="$(tofu -chdir="${ROOT}" state list)"
        if ! grep -Eq '^(module\.service\["fleet-api"\]\.railway_custom_domain\.this|module\.retired_fleet_api\.railway_custom_domain\.this|railway_custom_domain\.retired_fleet_api)$' <<< "${STATE}"; then
          echo "Retired domain recovery is already complete."
          exit 0
        fi
        # Module moves can expand targeting to active services. Recovery must use
        # their actual state revisions. Outputs can already contain a pending
        # release after a partial apply, so do not use output image_tags here.
        # Keep the caller's desired tags for the ordinary full plan below.
        DEPLOYED_IMAGE_TAGS="$(tofu -chdir="${ROOT}" show -json | jq -ce '
          def resources: .resources[]?, (.child_modules[]? | resources);
          [.values.root_module | resources
           | select(.type == "railway_service" and (.address | startswith("module.service[")))
           | {key: .values.name, value: (.values.source_image | capture(":(?<tag>[^/:]+)$").tag)}]
          | from_entries
        ')"
        TF_VAR_image_tags="${DEPLOYED_IMAGE_TAGS}" tofu -chdir="${ROOT}" plan -input=false -refresh=false -lock-timeout=15m -parallelism=1 \
          '-target=module.service["fleet-api"].railway_custom_domain.this' \
          -target=module.retired_fleet_api.railway_custom_domain.this \
          -target=railway_custom_domain.retired_fleet_api -out=domain-recovery.tfplan
        tofu -chdir="${ROOT}" show -json domain-recovery.tfplan | jq -e '
          all((.resource_changes // [])[];
            .mode == "data" or .change.actions == ["no-op"] or
            (.address == "railway_custom_domain.retired_fleet_api" and
             .change.actions == ["forget"] and
             .change.before.id == "22efd584-cecb-4da6-a362-e7a8898edfb7"))
        ' > /dev/null
        tofu -chdir="${ROOT}" show -no-color domain-recovery.tfplan
        TF_VAR_image_tags="${DEPLOYED_IMAGE_TAGS}" tofu -chdir="${ROOT}" apply -input=false -lock-timeout=15m -parallelism=1 domain-recovery.tfplan
        rm -f "${ROOT}/domain-recovery.tfplan"
    - name: Plan
      id: plan
      if: inputs.mode == 'apply'
      shell: bash
      env:
        TOFU_ROOT: ${{ inputs.root }}
      # Only planning can be replayed; Apply below consumes that saved plan once.
      run: |
        bun scripts/tofu-plan.ts
        tofu -chdir="packages/infra/tofu/${TOFU_ROOT}" show -no-color apply.tfplan
        # Export addresses only; plan values can contain credentials.
        changed=$(tofu -chdir="packages/infra/tofu/${TOFU_ROOT}" show -json apply.tfplan | jq -c \
          '[.resource_changes[]? | select(.mode == "managed" and .change.actions != ["no-op"]) | .address]')
        echo "changed_resources=${changed}" >> "$GITHUB_OUTPUT"
    - name: Apply
      if: inputs.mode == 'apply'
      shell: bash
      env:
        TOFU_ROOT: ${{ inputs.root }}
      run: tofu -chdir="packages/infra/tofu/${TOFU_ROOT}" apply -input=false -lock-timeout=15m -parallelism=1 apply.tfplan
