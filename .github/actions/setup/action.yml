name: Install dependencies
description: Install the pinned Bun toolchain and frozen workspace dependencies.
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.11
      name: Set up Bun
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
    - shell: bash
      run: bun install --frozen-lockfile
