name: Install dependencies
description: Install the pinned Bun toolchain and frozen workspace dependencies.
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.4
      name: Set up Bun
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
    - name: Cache Bun downloads
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-1.4.4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-1.4.4-${{ runner.os }}-${{ runner.arch }}-
    - shell: bash
      run: bun install --frozen-lockfile
