name: Turborepo Vault secrets (OIDC)
description: Load independent R2 and portfolio credential groups from OpenBao.
inputs:
  vault_config:
    description: Vault config path segment (dev or prd)
    required: true
  optional:
    description: Skip unavailable credential groups for optional integration checks.
    default: 'false'
outputs:
  vault_available:
    description: true when at least one credential group loaded successfully
    value: ${{ steps.mark.outputs.vault_available }}
runs:
  using: composite
  steps:
    - id: readiness
      name: Wait for Vault to be unsealed
      shell: bash
      env:
        OPTIONAL: ${{ inputs.optional }}
      run: |
        set -euo pipefail
        attempts=180
        if [ "$OPTIONAL" = true ]; then attempts=6; fi
        for _attempt in $(seq 1 "$attempts"); do
          code="$(curl --connect-timeout 3 --max-time 5 -s -o /dev/null -w '%{http_code}' \
            'https://vault.chrisvouga.dev/v1/sys/health?standbyok=true&perfstandbyok=true' || true)"
          case "$code" in
            200|429|472|473)
              echo 'ready=true' >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          sleep 5
        done
        echo 'ready=false' >> "$GITHUB_OUTPUT"
        if [ "$OPTIONAL" = true ]; then
          echo '::warning::SKIP optional Vault integrations: Vault unavailable'
        else
          echo '::error::Vault unavailable for the integration checks'
          exit 1
        fi
    - id: s3
      if: steps.readiness.outputs.ready == 'true'
      continue-on-error: true
      uses: hashicorp/vault-action@v4
      with:
        url: https://vault.chrisvouga.dev
        method: jwt
        path: jwt
        role: github-actions
        jwtGithubAudience: https://vault.chrisvouga.dev
        secrets: |
          secret/data/personal/${{ inputs.vault_config }} S3_ENDPOINT | S3_ENDPOINT ;
          secret/data/personal/${{ inputs.vault_config }} S3_REGION | S3_REGION ;
          secret/data/personal/${{ inputs.vault_config }} S3_ACCESS_KEY_ID | S3_ACCESS_KEY_ID ;
          secret/data/personal/${{ inputs.vault_config }} S3_SECRET_ACCESS_KEY | S3_SECRET_ACCESS_KEY ;
          secret/data/personal/${{ inputs.vault_config }} S3_BUCKET | S3_BUCKET
    - id: portfolio
      if: steps.readiness.outputs.ready == 'true'
      continue-on-error: true
      uses: hashicorp/vault-action@v4
      with:
        url: https://vault.chrisvouga.dev
        method: jwt
        path: jwt
        role: github-actions
        jwtGithubAudience: https://vault.chrisvouga.dev
        secrets: |
          secret/data/personal/${{ inputs.vault_config }} PORTFOLIO_GITHUB_TOKEN | PORTFOLIO_GITHUB_TOKEN
    - id: mark
      shell: bash
      env:
        AVAILABLE: ${{ steps.s3.outcome == 'success' || steps.portfolio.outcome == 'success' }}
      run: echo "vault_available=$AVAILABLE" >> "$GITHUB_OUTPUT"
