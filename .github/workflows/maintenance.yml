name: Maintenance
on:
  schedule:
    - cron: 30 15 * * *
    - cron: 0 13 * * *
    - cron: 0 14 * * 1
  workflow_dispatch:
    inputs:
      task:
        description: Task
        type: choice
        options:
          - health
          - deployment-logs
          - domains
          - snapshot
          - dependencies
          - vault-inputs
          - links
        default: health
      package_name:
        description: Optional container package name for read-only visibility inspection
        type: string
        default: ''
      deployment_ids:
        description: Comma-separated deployment UUIDs for read-only log diagnostics
        type: string
        default: ''
      drift:
        description: Include infrastructure drift
        type: boolean
        default: true
      strict:
        description: Fail domain checks on skipped results
        type: boolean
        default: true
      dry_run:
        description: Plan secret repair without applying
        type: boolean
        default: false
      from_vault:
        description: Vault fields to refresh (comma-separated)
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: maintenance-${{ github.event.schedule || inputs.task }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  deployment-logs:
    name: Deployment logs
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'deployment-logs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Read build and runtime logs
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          DEPLOYMENT_IDS: ${{ inputs.deployment_ids }}
        run: bun scripts/ci/deployment-logs.ts
      - name: Read container package visibility
        if: inputs.package_name != ''
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          GH_OWNER: ${{ github.repository_owner }}
          GHCR_PACKAGE: ${{ inputs.package_name }}
        run: |
          [[ "$GHCR_PACKAGE" =~ ^[a-zA-Z0-9._-]+$ ]] || exit 1
          gh api "users/${GH_OWNER}/packages/container/${GHCR_PACKAGE}" \
            --jq '{name, visibility, repository: .repository.full_name}'
  health:
    name: Health
    if: (github.event_name == 'schedule' && github.event.schedule == '30 15 * * *')
      || (github.event_name == 'workflow_dispatch' && (inputs.task == 'health'
      || inputs.task == 'domains'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      VAULT_ADDR: https://vault.chrisvouga.dev
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.cache/tofu-providers
      TF_VAR_state_passphrase: ${{ secrets.TOFU_STATE_PASSPHRASE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TOFU_STATE_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TOFU_STATE_SECRET_KEY }}
      AWS_EC2_METADATA_DISABLED: "true"
      TF_VAR_state_access_key: ${{ secrets.TOFU_STATE_ACCESS_KEY }}
      TF_VAR_state_secret_key: ${{ secrets.TOFU_STATE_SECRET_KEY }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CF_API_TOKEN }}
      TF_VAR_railway_token: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      TF_VAR_planetscale_service_token_id: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
      TF_VAR_planetscale_service_token: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}
      TF_VAR_neon_api_key: ${{ secrets.NEON_API_KEY }}
      TF_VAR_github_token: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
      TF_VAR_vault_inputs: ${{ secrets.TOFU_VAULT_INPUTS }}
      TOFU_VAULT_INPUTS: ${{ secrets.TOFU_VAULT_INPUTS }}
      TOFU_MIGRATION_READY: ${{ vars.TOFU_MIGRATION_READY }}
      DRIFT: ${{ inputs.task != 'domains' && (github.event_name == 'schedule' ||
        inputs.drift) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Cache verified providers
        uses: actions/cache@v4
        with:
          path: .cache/tofu-providers
          key: tofu-1.13-${{ runner.os }}-${{ runner.arch }}-health-${{
            hashFiles('packages/infra/tofu/**/.terraform.lock.hcl') }}
          restore-keys: |
            tofu-1.13-${{ runner.os }}-${{ runner.arch }}-health-
            tofu-1.13-${{ runner.os }}-${{ runner.arch }}-
      - name: Prepare provider cache
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - name: Install DNS probe tool
        run: |
          if ! command -v dig >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y dnsutils
          fi
      - name: Prepare foundation root
        if: ${{ !cancelled() && env.DRIFT == 'true' }}
        uses: ./.github/actions/tofu
        with:
          root: foundation
          mode: prepare
      - name: Prepare bootstrap root
        if: ${{ !cancelled() && env.DRIFT == 'true' }}
        uses: ./.github/actions/tofu
        with:
          root: bootstrap
          mode: prepare
      - name: Prepare vault root
        if: ${{ !cancelled() && env.DRIFT == 'true' }}
        uses: ./.github/actions/tofu
        with:
          root: vault
          mode: prepare
      - name: Prepare services root
        if: ${{ !cancelled() && env.DRIFT == 'true' }}
        uses: ./.github/actions/tofu
        with:
          root: services
          mode: prepare
      - name: Log in to Vault (OIDC, read-only)
        if: "!cancelled() && inputs.task != 'domains'"
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ env.VAULT_ADDR }}
          method: jwt
          path: jwt
          role: github-actions
          jwtGithubAudience: ${{ env.VAULT_ADDR }}
          exportToken: true
      - name: Infra health report
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          TASK: ${{ inputs.task }}
          STRICT: ${{ inputs.strict }}
        run: |
          if [ "$TASK" = domains ]; then
            args=(--only domains --verbose)
            if [ "$STRICT" = true ]; then args+=(--strict); fi
            bun run health -- "${args[@]}"
          elif [ "$DRIFT" = true ]; then
            bun run health -- --verbose --drift
          else
            bun run health -- --verbose
          fi
  links:
    name: Portfolio links
    if: (github.event_name == 'schedule' && github.event.schedule == '30 15 * * *')
      || (github.event_name == 'workflow_dispatch' && inputs.task == 'links')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Check every public link the portfolio shows
        id: check
        continue-on-error: true
        run: >
          set -o pipefail

          bun run packages/portfolio/scripts/health-check-urls.ts \
            --timeout-ms 30000 --retries 4 --retry-delay-ms 5000 2>&1 | tee link-report.txt
      - name: Open or update the broken-link issue
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Portfolio: broken public links"
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "The daily portfolio link check failed: ${run_url}"
            echo
            echo '~~~'
            tail -n 60 link-report.txt
            echo '~~~'
          } > issue-body.md
          number="$(gh issue list --state open --search "in:title \"${TITLE}\"" --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file issue-body.md
          else
            gh issue create --title "$TITLE" --body-file issue-body.md
          fi
          exit 1
  update:
    name: Update
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'schedule' &&
      github.event.schedule != '30 15 * * *') || (github.event_name ==
      'workflow_dispatch' && (inputs.task == 'snapshot' || inputs.task ==
      'dependencies')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      actions: read
      pull-requests: read
    env:
      REFRESH_BRANCH: chore/github-insights-refresh
      SNAPSHOT: packages/portfolio/src/data/github-insights.json
      VERIFICATION: packages/portfolio/src/data/verification.json
      FACTS: packages/portfolio/src/data/platform-facts.json
      PROFILE_README: packages/portfolio/generated/github-profile-README.md
      CHECKLIST: packages/portfolio/CONSISTENCY_CHECKLIST.md
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Choose update
        id: task
        env:
          TASK: ${{ inputs.task }}
          SCHEDULE: ${{ github.event.schedule }}
        run: >
          task="$TASK"

          if [ -z "$task" ]; then
            if [ "$SCHEDULE" = "0 14 * * 1" ]; then task=dependencies; else task=snapshot; fi
          fi

          echo "task=$task" >> "$GITHUB_OUTPUT"
      - name: Read snapshot credentials
        if: steps.task.outputs.task == 'snapshot'
        uses: hashicorp/vault-action@v4
        continue-on-error: true
        with:
          url: https://vault.chrisvouga.dev
          method: jwt
          path: jwt
          role: github-actions
          jwtGithubAudience: https://vault.chrisvouga.dev
          secrets: secret/data/personal/prd PORTFOLIO_GITHUB_TOKEN |
            PORTFOLIO_GITHUB_TOKEN
      - name: Refresh GitHub snapshot
        id: refresh
        if: steps.task.outputs.task == 'snapshot'
        working-directory: packages/portfolio
        run: bun run refresh-github
      - name: Recompute platform facts
        id: facts
        if: ${{ !cancelled() && steps.task.outputs.task == 'snapshot' }}
        working-directory: packages/portfolio
        run: bun run facts
      - name: Refresh verification snapshot
        id: verification
        if: ${{ !cancelled() && steps.task.outputs.task == 'snapshot' }}
        working-directory: packages/portfolio
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run refresh-verification
      - name: Regenerate the GitHub profile README and consistency checklist
        if: ${{ !cancelled() && steps.task.outputs.task == 'snapshot' }}
        working-directory: packages/portfolio
        run: bun run gen:profile-readme
      - name: Open a self-merging PR for the refreshed snapshot
        if: ${{ !cancelled() && steps.task.outputs.task == 'snapshot' }}
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          TITLE: "chore(portfolio): refresh GitHub insights snapshot"
          PR_BODY: Automated daily refresh of the committed GitHub proof snapshot (the
            offline fallback rendered when GitHub is unreachable at build time),
            the verification snapshot and the platform facts. Opened by
            Maintenance.
        run: >
          set -euo pipefail

          if [ -z "$(git status --porcelain -- "${SNAPSHOT}" "${VERIFICATION}"
          "${FACTS}" "${PROFILE_README}" "${CHECKLIST}")" ]; then
            echo 'No refreshed data to commit'
            exit 0
          fi

          git config user.name 'github-actions[bot]'

          git config user.email
          '41898282+github-actions[bot]@users.noreply.github.com'

          git checkout -b "${REFRESH_BRANCH}"

          git add -- "${SNAPSHOT}" "${VERIFICATION}" "${FACTS}"
          "${PROFILE_README}" "${CHECKLIST}"

          git commit -m "${TITLE}"

          git fetch origin "${REFRESH_BRANCH}" || true

          git push --force-with-lease origin "${REFRESH_BRANCH}"


          if [ -z "$(gh pr list --head "${REFRESH_BRANCH}" --state open --json
          number --jq '.[].number')" ]; then
            gh pr create \
              --base main \
              --head "${REFRESH_BRANCH}" \
              --title "${TITLE}" \
              --body "$PR_BODY"
          fi

          gh pr merge "${REFRESH_BRANCH}" --auto --merge
  repair:
    name: Repair
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'vault-inputs' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      VAULT_ADDR: https://vault.chrisvouga.dev
      TF_VAR_state_passphrase: ${{ secrets.TOFU_STATE_PASSPHRASE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TOFU_STATE_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TOFU_STATE_SECRET_KEY }}
      AWS_EC2_METADATA_DISABLED: "true"
      TF_VAR_state_access_key: ${{ secrets.TOFU_STATE_ACCESS_KEY }}
      TF_VAR_state_secret_key: ${{ secrets.TOFU_STATE_SECRET_KEY }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CF_API_TOKEN }}
      TF_VAR_railway_token: ${{ secrets.RAILWAY_TOKEN }}
      TF_VAR_planetscale_service_token_id: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
      TF_VAR_planetscale_service_token: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}
      TF_VAR_neon_api_key: ${{ secrets.NEON_API_KEY }}
      TF_VAR_github_token: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
      TF_VAR_vault_inputs: ${{ secrets.TOFU_VAULT_INPUTS }}
      TOFU_VAULT_INPUTS: ${{ secrets.TOFU_VAULT_INPUTS }}
      TOFU_MIGRATION_READY: ${{ vars.TOFU_MIGRATION_READY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Prepare foundation
        uses: ./.github/actions/tofu
        with:
          root: foundation
          mode: prepare
      - name: Log in to Vault (OIDC, read-only)
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ env.VAULT_ADDR }}
          method: jwt
          path: jwt
          role: github-actions
          jwtGithubAudience: ${{ env.VAULT_ADDR }}
          exportToken: true
      - name: Complete TOFU_VAULT_INPUTS
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          FROM_VAULT: ${{ inputs.from_vault }}
        run: >
          set -euo pipefail

          args=(--ci)

          if [ "${DRY_RUN}" = true ]; then args+=(--dry-run); fi

          if [ -n "${FROM_VAULT}" ]; then args+=(--from-vault "${FROM_VAULT}");
          fi

          bun run vault:fix "${args[@]}"
