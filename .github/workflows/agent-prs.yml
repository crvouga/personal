name: Agent PRs
# Hourly hygiene for agent PRs: label, update behind branches, flag conflicts,
# auto-merge Dependabot, and mark/close idle PRs. See scripts/ci/agent-prs.ts.
on:
  schedule:
    - cron: '23 * * * *'
  pull_request:
    types: [opened, reopened]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: agent-prs
  cancel-in-progress: false
jobs:
  label:
    name: Label agent PR
    if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 't3/') ||
      startsWith(github.head_ref, 'agent/'))
    runs-on: ubuntu-slim
    timeout-minutes: 2
    permissions:
      pull-requests: write
    steps:
      - name: Add agent-generated
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --add-label agent-generated
  hygiene:
    name: Update, conflicts and Dependabot
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Tend open PRs
        env:
          # Pushes and merges made with GITHUB_TOKEN start no workflows, so
          # updated branches would never get required checks. Use the PAT.
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
        run: bun scripts/ci/agent-prs.ts
  stale:
    name: Stale agent PRs
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@1e223db275d687790206a7acac4d1a11bd6fe629 # v10.4.0
        with:
          days-before-issue-stale: -1
          days-before-issue-close: -1
          days-before-pr-stale: 2
          days-before-pr-close: 3
          any-of-pr-labels: agent-generated
          exempt-pr-labels: needs-human
          stale-pr-label: stale
          stale-pr-message: No activity for 2 days. This agent PR closes in 3 more days unless it is updated or labeled needs-human.
          close-pr-message: Closed after 5 idle days.
          delete-branch: true
