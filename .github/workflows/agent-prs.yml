name: Agent PRs
# Agent PRs merge themselves: a non-draft agent PR gets squash auto-merge as
# soon as it is opened or marked ready, so it merges when `Check` passes.
# Hourly hygiene re-applies that, updates behind branches, flags conflicts,
# auto-merges Dependabot and marks/closes idle PRs (scripts/ci/agent-prs.ts).
# Labeling a PR needs-human or do-not-merge turns off its auto-merge.
on:
  schedule:
    - cron: '23 * * * *'
  pull_request:
    types: [opened, reopened, ready_for_review, labeled]
  workflow_dispatch: {}
permissions:
  contents: read
# One group per PR, so PR events never wait behind (or get dropped by) the
# hourly run, which GitHub would do with a single shared group.
concurrency:
  group: agent-prs-${{ github.event.pull_request.number || 'hygiene' }}
  cancel-in-progress: false
jobs:
  label:
    name: Label agent PR
    if: github.event_name == 'pull_request' && github.event.action != 'labeled' &&
      (startsWith(github.head_ref, 't3/') || startsWith(github.head_ref, 'agent/'))
    runs-on: ubuntu-slim
    timeout-minutes: 2
    permissions:
      pull-requests: write
    steps:
      - name: Add agent-generated
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --add-label agent-generated
  auto_merge:
    name: Enable auto-merge
    if: github.event_name == 'pull_request' && github.event.action != 'labeled' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 't3/') || startsWith(github.head_ref, 'agent/')) &&
      !contains(github.event.pull_request.labels.*.name, 'needs-human') &&
      !contains(github.event.pull_request.labels.*.name, 'do-not-merge')
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Squash when Check passes
        env:
          # A merge made with GITHUB_TOKEN starts no workflows, so main would
          # never run CI or deploy. Use the PAT.
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR" -R "$GITHUB_REPOSITORY" --auto --squash
  hold_auto_merge:
    name: Hold auto-merge
    if: github.event_name == 'pull_request' && github.event.action == 'labeled' &&
      (github.event.label.name == 'needs-human' || github.event.label.name == 'do-not-merge')
    runs-on: ubuntu-slim
    timeout-minutes: 2
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Turn off auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR" -R "$GITHUB_REPOSITORY" --disable-auto || echo "Auto-merge was not on"
  hygiene:
    name: Update, conflicts and Dependabot
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Tend open PRs
        env:
          # Pushes and merges made with GITHUB_TOKEN start no workflows, so
          # updated branches would never get required checks. Use the PAT.
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
        run: bun scripts/ci/agent-prs.ts
  stale:
    name: Stale agent PRs
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-issue-stale: -1
          days-before-issue-close: -1
          days-before-pr-stale: 2
          days-before-pr-close: 3
          any-of-pr-labels: agent-generated
          exempt-pr-labels: needs-human
          stale-pr-label: stale
          stale-pr-message: No activity for 2 days. This agent PR closes in 3 more days unless it is updated or labeled needs-human.
          close-pr-message: Closed after 5 idle days.
          delete-branch: true
