name: Runner check
on:
  workflow_call:
    inputs:
      use_github_hosted:
        description: Select ubuntu-24.04 while the fleet is unavailable
        type: boolean
        required: false
        default: false
      nix_command:
        description: Shell command to run inside the caller's devShell
        type: string
        required: true
permissions:
  contents: read
jobs:
  check:
    uses: crvouga/fleet/.github/workflows/runner-check.yml@e3f9a3ddf74df06d31596ab40720d9513b04e054
    with:
      use_github_hosted: ${{ inputs.use_github_hosted }}
      nix_command: ${{ inputs.nix_command }}
run-name: "Runner check · ${{ github.event_name == 'pull_request' && format('PR
  #{0} · {1}', github.event.pull_request.number, github.head_ref) || format('{0}
  · {1}', github.repository, github.ref_name) }}"
