# Repairs the TOFU_VAULT_INPUTS Actions secret without an operator at a terminal.
#
# GitHub never returns secret values through its API, but a workflow receives
# them. This run reads the current secret and the state credentials from its own
# environment, fills the required Vault fields that have an automatic source (a
# renamed field's old value, the live prd Vault document), and applies the
# foundation root's TOFU_VAULT_INPUTS secret through OpenTofu. If a field has no
# automatic source it fails naming the field; `bun run vault:fix` supplies it.
#
# Run it from `bun run vault:fix` (which offers to) or with `gh workflow run`.

name: Vault inputs fix
run-name: Vault inputs fix${{ inputs.dry_run && ' (dry run)' || '' }}

permissions:
  contents: read
  id-token: write

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan only; do not update the secret
        type: boolean
        default: false
      from_vault:
        description: Comma-separated fields to overwrite with the live Vault's values
        type: string
        default: ''

concurrency:
  group: vault-inputs-fix
  cancel-in-progress: false

env:
  VAULT_ADDR: https://vault.chrisvouga.dev

  TF_VAR_state_passphrase: ${{ secrets.TOFU_STATE_PASSPHRASE }}
  AWS_ACCESS_KEY_ID: ${{ secrets.TOFU_STATE_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.TOFU_STATE_SECRET_KEY }}
  AWS_EC2_METADATA_DISABLED: 'true'
  TF_VAR_state_access_key: ${{ secrets.TOFU_STATE_ACCESS_KEY }}
  TF_VAR_state_secret_key: ${{ secrets.TOFU_STATE_SECRET_KEY }}
  TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
  TF_VAR_cloudflare_api_token: ${{ secrets.CF_API_TOKEN }}
  TF_VAR_railway_token: ${{ secrets.RAILWAY_TOKEN }}
  TF_VAR_planetscale_service_token_id: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
  TF_VAR_planetscale_service_token: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}
  TF_VAR_neon_api_key: ${{ secrets.NEON_API_KEY }}
  TF_VAR_github_token: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
  TF_VAR_vault_inputs: ${{ secrets.TOFU_VAULT_INPUTS }}
  TOFU_VAULT_INPUTS: ${{ secrets.TOFU_VAULT_INPUTS }}
  TOFU_MIGRATION_READY: ${{ vars.TOFU_MIGRATION_READY }}

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Initializes the backend and exports the variables the root needs.
      - uses: ./.github/actions/tofu
        with:
          root: foundation
          mode: prepare
      # Last, so the 15-minute token is fresh when the script reads Vault.
      - name: Log in to Vault (OIDC, read-only)
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ env.VAULT_ADDR }}
          method: jwt
          path: jwt
          role: github-actions
          jwtGithubAudience: ${{ env.VAULT_ADDR }}
          exportToken: true
      - name: Complete TOFU_VAULT_INPUTS
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          FROM_VAULT: ${{ inputs.from_vault }}
        run: |
          set -euo pipefail
          args=(--ci)
          if [ "${DRY_RUN}" = true ]; then args+=(--dry-run); fi
          if [ -n "${FROM_VAULT}" ]; then args+=(--from-vault "${FROM_VAULT}"); fi
          bun run vault:fix "${args[@]}"
