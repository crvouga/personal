name: Guardrails
# Required check for unreviewed code. Runs again when labels change, so adding
# needs-human re-evaluates the same commit. See scripts/ci/protected-paths.ts.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group: {}
permissions:
  contents: read
concurrency:
  group: guardrails-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  protected_paths:
    name: protected-paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Check protected paths and weakened checks
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: bun scripts/ci/protected-paths.ts
      - name: Summarize failure
        if: failure()
        uses: ./.github/actions/failure-summary
        with:
          name: protected-paths
  hold_auto_merge:
    name: Hold auto-merge
    if: github.event_name == 'pull_request' && github.event.action == 'labeled' &&
      (github.event.label.name == 'needs-human' || github.event.label.name == 'do-not-merge')
    runs-on: ubuntu-slim
    timeout-minutes: 2
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Turn off auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR" -R "$GITHUB_REPOSITORY" --disable-auto || echo "Auto-merge was not on"
