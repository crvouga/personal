name: Fleet cache
on:
  merge_group: {}
  push:
    branches: [main]
  workflow_run:
    workflows: [Deploy]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: fleet-cache-${{ github.event_name == 'merge_group' && github.sha || 'main' }}
  cancel-in-progress: false
jobs:
  publish:
    if: (github.ref == 'refs/heads/main' || github.event_name == 'merge_group') && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Reuse a healthy exact-revision publication
        id: existing
        working-directory: packages/fleet
        env:
          FLEET_CACHE_PROOF: ../../fleet-cache-proof.json
        run: bun ../turborepo-remote-cache/scripts/check-fleet-cache.ts
      - name: Build exact main role closures independently of physical nodes
        if: steps.existing.outputs.hit != 'true'
        working-directory: packages/fleet
        run: |
          set -euo pipefail
          for role in ci web cache netboot devbox; do
            nix build --no-write-lock-file --out-link "result-${role}" ".#${role}"
          done
      - name: Read isolated publisher credentials through GitHub OIDC
        if: steps.existing.outputs.hit != 'true'
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.chrisvouga.dev
          method: jwt
          role: ${{ github.event_name == 'merge_group' && 'fleet-cache-queue-publisher' || 'fleet-cache-publisher' }}
          jwtGithubAudience: https://vault.chrisvouga.dev
          secrets: |
            secret/data/fleet-cache/publisher NIX_CACHE_PRIVATE_KEY_PEM | NIX_CACHE_PRIVATE_KEY_PEM ;
            secret/data/fleet-cache/publisher S3_ENDPOINT | S3_ENDPOINT ;
            secret/data/fleet-cache/publisher S3_REGION | S3_REGION ;
            secret/data/fleet-cache/publisher S3_BUCKET | S3_BUCKET ;
            secret/data/fleet-cache/publisher S3_ACCESS_KEY_ID | S3_ACCESS_KEY_ID ;
            secret/data/fleet-cache/publisher S3_SECRET_ACCESS_KEY | S3_SECRET_ACCESS_KEY ;
      - name: Verify signatures and publish content before metadata
        if: steps.existing.outputs.hit != 'true'
        env:
          FLEET_CACHE_PROOF: fleet-cache-proof.json
        run: bun packages/turborepo-remote-cache/scripts/publish-fleet-cache.ts packages/fleet/result-ci packages/fleet/result-web packages/fleet/result-cache packages/fleet/result-netboot packages/fleet/result-devbox
      - uses: actions/upload-artifact@v4
        with:
          name: fleet-cache-proof
          path: fleet-cache-proof.json
          if-no-files-found: error
          retention-days: 7
