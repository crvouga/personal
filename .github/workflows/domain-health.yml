name: Domain health
run-name: Domain health · ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      strict:
        description: Fail on skipped/unverified checks as well as failures (completion gate)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: domain-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Install DNS probe tool
        run: sudo apt-get update && sudo apt-get install -y dnsutils
      - name: Read-only domain health
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CF_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          STRICT: ${{ inputs.strict }}
        run: |
          if [ "$STRICT" = true ]; then
            bun run health --only domains --strict --verbose
          else
            bun run health --only domains --verbose
          fi
