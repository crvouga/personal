name: CI
on:
  push:
    branches:
      - main
  pull_request: {}
  merge_group: {}
  workflow_dispatch: {}
  workflow_call:
    inputs:
      service_id:
        description: Service id matching OpenTofu inventory (e.g. portfolio, todo-app).
        required: true
        type: string
      dockerfile:
        description: Path to Dockerfile relative to context.
        required: false
        type: string
        default: ./Dockerfile
      context:
        description: Docker build context.
        required: false
        type: string
        default: .
      image_owner:
        description: ghcr.io owner.
        required: false
        type: string
        default: crvouga
      image_prefix:
        description: GHCR package prefix (from OpenTofu inventory image_prefix).
        required: false
        type: string
        default: chrisvouga
      infra_github_repo:
        description: Infra repo owner/name for deploy dispatch.
        required: false
        type: string
        default: crvouga/workspace
      notify_deploy:
        description: POST repository_dispatch to infra after push. Set false when chaining deploy.
        required: false
        type: boolean
        default: true
    secrets:
      DEPLOY_DISPATCH_TOKEN:
        description: PAT or GITHUB_TOKEN with repo dispatch to the infra repo.
        required: false
      CALLER_GITHUB_TOKEN:
        description: Caller workflow github.token — GHCR fallback when no platform publish token is supplied.
        required: false
      RAILWAY_TOKEN:
        description: Repo secret — vault bootstrap job only (not passed by callers).
        required: false
      CF_API_TOKEN:
        description: Repo secret — vault bootstrap job only (not passed by callers).
        required: false
      DB_CONNECTION_URI:
        description: Repo secret — vault bootstrap job only (not passed by callers).
        required: false
      PLANETSCALE_SERVICE_TOKEN_ID:
        required: false
      PLANETSCALE_SERVICE_TOKEN:
        required: false
      NEON_API_KEY:
        required: false
      TOFU_STATE_PASSPHRASE:
        required: false
      TOFU_STATE_ACCESS_KEY:
        required: false
      TOFU_STATE_SECRET_KEY:
        required: false
      TOFU_VAULT_INPUTS:
        required: false
      FLEET_ATTIC_TOKEN:
        required: false
        description: Only used by native fleet merge-queue runs.
    outputs:
      image_tag:
        description: Image tag pushed (commit SHA).
        value: ${{ jobs.publish.outputs.image_tag }}
      service_id:
        description: Service id that was published.
        value: ${{ jobs.publish.outputs.service_id }}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  check:
    name: Check
    if: inputs.service_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    env:
      TF_VAR_state_passphrase: validation-only-passphrase-never-used-for-real-state
      TURBO_CACHE: local:rw
    outputs:
      fleet: ${{ steps.filter.outputs.fleet == 'true' || steps.release.outputs.missing == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check branches
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          BASE_REF: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_ref || github.base_ref }}
          HEAD_REF: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_ref || github.head_ref }}
        run: |
          set -euo pipefail
          test "${BASE_REF#refs/heads/}" = main
          test "${HEAD_REF#refs/heads/}" != main
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Find affected integrations
        id: filter
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || '' }}
          filters: |
            fleet:
              - 'packages/fleet/**'
              - '.github/**'
              - 'bun.lock'
            auth:
              - 'packages/auth-relay/**'
              - 'packages/infra/tofu/auth*/**'
              - 'packages/infra/tofu/modules/auth-*/**'
              - '.github/**'
            fleet_e2e:
              - 'packages/fleet/**'
              - 'packages/fleet-api/**'
              - 'packages/assert/**'
              - 'packages/logger/**'
              - 'bun.lock'
              - '.github/**'
            portfolio:
              - 'packages/portfolio/**'
            vault_inputs:
              - 'packages/infra/tofu/modules/inventory/**'
              - 'packages/infra/tofu/vault/**'
      - name: Check that the installer release is complete
        id: release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=$(gh release view fleet-installer --json assets --jq '.assets[].name') || assets=''
          for asset in \
            fleet-installer.iso.parts.json fleet-installer.iso.sha256 fleet-installer.iso.part-000 fleet-node.sh \
            fleet-installer-windows-x64.exe \
            fleet-installer-macos-arm64.zip fleet-installer-macos-x64.zip \
            fleet-installer-linux-arm64.tar.gz fleet-installer-linux-x64.tar.gz; do
            if ! grep -Fxq "$asset" <<< "$assets"; then
              echo "Installer release is missing $asset; rebuilding and publishing."
              echo 'missing=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo 'missing=false' >> "$GITHUB_OUTPUT"
      - name: Check commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bunx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - name: Check PR title
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check TOFU_VAULT_INPUTS against the inventory
        env:
          VAULT_INPUTS_STRICT: ${{ steps.filter.outputs.vault_inputs == 'true' }}
          TOFU_VAULT_INPUTS: ${{ secrets.TOFU_VAULT_INPUTS }}
        run: bun run check:vault-inputs
      - name: Fast repository checks
        run: bun run ci:format && bun run check:agents && bun run check:llms && bun run check:scripts
      - name: Typecheck and lint packages
        run: bunx turbo run tc lint
      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.0
          tofu_wrapper: false
      - name: Set up Atlas
        uses: ariga/setup-atlas@v0
      - name: Validate and test OpenTofu
        run: bun run check:infra
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Chromium (portfolio resume PDF)
        run: |
          cd packages/portfolio
          node node_modules/playwright/cli.js install --with-deps chromium
      - name: Test and build packages
        run: bunx turbo run test build
      - name: Health-check portfolio public URLs
        if: steps.filter.outputs.portfolio == 'true'
        run: |
          bun run packages/portfolio/scripts/health-check-urls.ts \
            --timeout-ms 30000 \
            --retries 4 \
            --retry-delay-ms 5000
      - name: Test Fleet integration
        if: steps.filter.outputs.fleet_e2e == 'true'
        env:
          FLEET_E2E_REQUIRED: "1"
        run: |
          bun run --filter @pkgs/fleet-api build:css
          python3 -B -m unittest discover -s packages/fleet/tests -p test_e2e_chain.py -v
          docker build -f packages/fleet-api/Dockerfile -t fleet-api:ci .
          FLEET_E2E_IMAGE=fleet-api:ci python3 -B -m unittest discover -s packages/fleet/tests -p test_e2e_chain.py -v
      - name: Test auth compatibility
        if: steps.filter.outputs.auth == 'true'
        run: |
          docker build -f packages/auth-relay/Dockerfile -t auth-relay-gateway:ci .
          docker build -f packages/auth-relay/Dockerfile.tunnel -t auth-relay-tunnel:ci packages/auth-relay
          python3 packages/auth-relay/tests/production-image.py
          (cd packages/fleet && bunx playwright install --with-deps chromium)
          bun run auth:test:e2e
      - name: Read optional integration credentials
        uses: ./.github/actions/turborepo-vault-secrets
        continue-on-error: true
        with:
          vault_config: dev
          optional: "true"
      - name: Check optional integrations
        continue-on-error: true
        env:
          CI: "true"
          VAULT_CONFIG: dev
          VAULT_PROJECT: personal
        run: bun run --filter @pkgs/turborepo-remote-cache smoke:secrets
  nix:
    name: Test Nix
    if: needs.check.outputs.fleet == 'true'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - name: Lint workflows and shell scripts
        run: nix develop ./packages/fleet --command bash packages/fleet/scripts/lint.sh
      - name: Test all Nix checks
        working-directory: packages/fleet
        run: |
          for group in roles runtime lifecycle image; do
            timeout 12m python3 scripts/ci-checks.py "$group"
          done
      - name: Upload fleet-installer
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: fleet-installer
          path: packages/fleet/result-iso/iso/fleet-installer.iso
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
  installer:
    name: Build installer (${{ matrix.os }})
    if: needs.check.outputs.fleet == 'true'
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15-intel
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wizard tests
        working-directory: packages/fleet
        run: python -B -m unittest discover -s tests -p "test_wizard.py" -v
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install only Fleet browser dependencies
        run: |
          bun install --frozen-lockfile --filter '@pkgs/fleet'
          cd packages/fleet
          bunx playwright install --with-deps chromium
      - name: Click through the wizard page in a real browser
        working-directory: packages/fleet
        shell: bash
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
          PLAYWRIGHT_PATH: "@playwright/test"
        run: node wizard/ui-e2e.cjs
      - name: Build the installer and run its self-test
        working-directory: packages/fleet
        run: |
          python -m pip install "pyinstaller>=6,<7"
          python wizard/build.py --version "${{ github.sha }}"
      - name: Select the packaged installer for browser acceptance
        working-directory: packages/fleet
        run: python bdd/packaged.py
      - name: Gherkin acceptance against the packaged installer
        working-directory: packages/fleet
        env:
          FLEET_BDD_EXPECT_VERSION: ${{ github.sha }}
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: bun run test:bdd:local
      - name: Upload fleet-bdd-${{ matrix.os }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-bdd-${{ matrix.os }}
          path: |
            packages/fleet/dist/bdd-report/
            packages/fleet/dist/bdd-results/
            packages/fleet/dist/bdd-results.json
          if-no-files-found: error
          retention-days: 14
      - name: Set up Nix
        if: startsWith(matrix.os, 'ubuntu-')
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - name: Native Nix installer and Gherkin acceptance
        if: startsWith(matrix.os, 'ubuntu-')
        working-directory: packages/fleet
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
          FLEET_BDD_EXPECT_VERSION: ${{ github.sha }}
          FLEET_BDD_OUTPUT_DIR: dist/bdd-native-results
          PLAYWRIGHT_HTML_OUTPUT_DIR: dist/bdd-native-report
          PLAYWRIGHT_JSON_OUTPUT_FILE: dist/bdd-native-results.json
        run: |
          nix build --no-write-lock-file -o result-native '.#fleet-installer'
          result-native/bin/fleet-installer --selftest
          FLEET_BDD_WIZARD="$PWD/result-native/bin/fleet-installer" bun run test:bdd:local
      - name: Upload fleet-bdd-native-${{ matrix.os }}
        if: always() && startsWith(matrix.os, 'ubuntu-')
        uses: actions/upload-artifact@v4
        with:
          name: fleet-bdd-native-${{ matrix.os }}
          path: |
            packages/fleet/dist/bdd-native-report/
            packages/fleet/dist/bdd-native-results/
            packages/fleet/dist/bdd-native-results.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload wizard-${{ matrix.os }}
        uses: actions/upload-artifact@v4
        with:
          name: wizard-${{ matrix.os }}
          path: packages/fleet/wizard/dist/*
          if-no-files-found: error
          retention-days: 14
  release:
    name: Release installer
    if: needs.check.outputs.fleet == 'true' && (github.event_name == 'merge_group' || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request'))
    needs:
      - check
      - nix
      - installer
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Nix
        if: github.event_name == 'merge_group'
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - name: Push role closures before this commit can reach main
        if: github.event_name == 'merge_group'
        working-directory: packages/fleet
        env:
          CACHE_URL: ${{ vars.FLEET_CACHE_URL }}
          CACHE_NAME: ${{ vars.FLEET_CACHE_NAME }}
          ATTIC_TOKEN: ${{ secrets.FLEET_ATTIC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CACHE_URL}" ] || [ -z "${CACHE_NAME}" ] || [ -z "${ATTIC_TOKEN}" ]; then
            echo 'TODO: set FLEET_CACHE_URL, FLEET_CACHE_NAME, and FLEET_ATTIC_TOKEN. A fleet commit cannot merge until the cache push succeeds.' >&2
            exit 1
          fi
          for attr in ci web cache netboot devbox; do
            nix build -o "result-${attr}" ".#${attr}"
            if [ ! -L "result-${attr}" ] || [ ! -d "result-${attr}" ]; then
              echo "Fleet cache: missing build result for ${attr}. Rebuild this role before publishing." >&2
              exit 1
            fi
          done
          nix run '.#attic-client' -- login fleet "$CACHE_URL" "$ATTIC_TOKEN"
          for attr in ci web cache netboot devbox; do
            nix run '.#attic-client' -- push "$CACHE_NAME" "./result-${attr}"
          done
      - name: Download fleet-installer
        uses: actions/download-artifact@v4
        with:
          name: fleet-installer
          path: installer-artifact
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: wizard-*
          path: wizard-artifacts
          merge-multiple: true
      - name: Publish the installer and the one-file node entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          iso=$(find installer-artifact -type f -name 'fleet-installer.iso' -print -quit)
          test -n "$iso"
          # The offline image contains every role and exceeds the 2 GiB asset
          # limit. Clients assemble verified 1 GiB parts into one local ISO.
          python3 packages/fleet/scripts/release-image.py "$iso" image-assets
          cp packages/fleet/scripts/fleet-node.sh fleet-node.sh
          if gh release view fleet-installer >/dev/null 2>&1; then
            gh release upload fleet-installer image-assets/*.part-* --clobber
          else
            gh release create fleet-installer image-assets/*.part-* \
              --title "Fleet installer" \
              --notes "Current installer image and the one-file node entry. Replaced when Fleet merges. This release does not expire."
          fi
          # Publish the manifest after its parts; partial releases fail verification.
          gh release upload fleet-installer image-assets/*.json image-assets/*.sha256 fleet-node.sh --clobber
          # The wizard downloads: one per platform. Every one passed its self-test in CI.
          find wizard-artifacts -type f -exec ls -l {} +
          count=$(find wizard-artifacts -type f | wc -l)
          test "$count" -ge 5
          gh release upload fleet-installer wizard-artifacts/* --clobber
  fleet:
    name: Fleet
    if: always() && inputs.service_id == ''
    needs:
      - check
      - nix
      - installer
      - release
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check platform results
        env:
          RESULTS: ${{ toJSON(needs) }}
          FLEET: ${{ needs.check.outputs.fleet }}
          RELEASE_REQUIRED: ${{ github.event_name == 'merge_group' || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
          test "$(jq -r '.check.result' <<< "$RESULTS")" = success
          if [ "$FLEET" != true ]; then exit 0; fi
          for job in nix installer; do
            test "$(jq -r --arg job "$job" '.[$job].result' <<< "$RESULTS")" = success
          done
          if [ "$RELEASE_REQUIRED" = true ]; then
            test "$(jq -r '.release.result' <<< "$RESULTS")" = success
          fi
  Required:
    name: Required
    if: always() && inputs.service_id == '' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    needs:
      - check
      - fleet
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check legacy merge status
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
  deploy:
    name: Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.service_id == ''
    needs:
      - check
      - fleet
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
  publish:
    name: Publish
    if: inputs.service_id != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      service_id: ${{ inputs.service_id }}
      dockerfile: ${{ inputs.dockerfile }}
      context: ${{ inputs.context }}
      image_owner: ${{ inputs.image_owner }}
      image_prefix: ${{ inputs.image_prefix }}
      infra_github_repo: ${{ inputs.infra_github_repo }}
      notify_deploy: ${{ inputs.notify_deploy }}
    secrets:
      DEPLOY_DISPATCH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
      CALLER_GITHUB_TOKEN: ${{ secrets.CALLER_GITHUB_TOKEN }}
