name: CI
on:
  push:
    branches:
      - main
  pull_request: {}
  merge_group: {}
  workflow_dispatch: {}
  workflow_call:
    inputs:
      service_id:
        description: Service id matching OpenTofu inventory (e.g. portfolio, todo-app).
        required: true
        type: string
      dockerfile:
        description: Path to Dockerfile relative to context.
        required: false
        type: string
        default: ./Dockerfile
      context:
        description: Docker build context.
        required: false
        type: string
        default: .
      image_owner:
        description: ghcr.io owner.
        required: false
        type: string
        default: crvouga
      image_prefix:
        description: GHCR package prefix (from OpenTofu inventory image_prefix).
        required: false
        type: string
        default: chrisvouga
      infra_github_repo:
        description: Infra repo owner/name for deploy dispatch.
        required: false
        type: string
        default: crvouga/personal
      notify_deploy:
        description: POST repository_dispatch to infra after push. Set false when
          chaining deploy.
        required: false
        type: boolean
        default: true
    secrets:
      DEPLOY_DISPATCH_TOKEN:
        description: PAT or GITHUB_TOKEN with repo dispatch to the infra repo.
        required: false
      CALLER_GITHUB_TOKEN:
        description: Caller workflow github.token — GHCR fallback when no platform
          publish token is supplied.
        required: false
      RAILWAY_TOKEN:
        description: Repo secret — vault bootstrap job only (not passed by callers).
        required: false
      CF_API_TOKEN:
        description: Repo secret — vault bootstrap job only (not passed by callers).
        required: false
      DB_CONNECTION_URI:
        description: Repo secret — vault bootstrap job only (not passed by callers).
        required: false
      PLANETSCALE_SERVICE_TOKEN_ID:
        required: false
      PLANETSCALE_SERVICE_TOKEN:
        required: false
      NEON_API_KEY:
        required: false
      TOFU_STATE_PASSPHRASE:
        required: false
      TOFU_STATE_ACCESS_KEY:
        required: false
      TOFU_STATE_SECRET_KEY:
        required: false
      TOFU_VAULT_INPUTS:
        required: false
    outputs:
      image_tag:
        description: Image tag pushed (commit SHA).
        value: ${{ jobs.publish.outputs.image_tag }}
      service_id:
        description: Service id that was published.
        value: ${{ jobs.publish.outputs.service_id }}
permissions:
  contents: read
# Superseded PR runs are cancelled. Every main, merge-queue and manual run gets
# its own group, so none is cancelled or replaced while pending.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' &&
    github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  changes:
    name: Plan checks
    if: inputs.service_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      auth: ${{ steps.filter.outputs.auth == 'true' || github.event_name ==
        'workflow_dispatch' }}
      portfolio: ${{ steps.filter.outputs.portfolio == 'true' || github.event_name ==
        'workflow_dispatch' }}
      infra: ${{ steps.filter.outputs.infra == 'true' || github.event_name ==
        'workflow_dispatch' }}
      vault_inputs: ${{ steps.filter.outputs.vault_inputs }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 2
      - name: Find affected integrations
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ github.event_name == 'merge_group' &&
            github.event.merge_group.base_sha || '' }}
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha
            || '' }}
          filters: |
            infra:
              - packages/infra/**
              - packages/auth-relay/**
              - scripts/**
              - .github/**
              - package.json
              - bun.lock
            auth:
              - packages/admin-ui/**
              - packages/assert/**
              - packages/logger/**
              - bun.lock
              - package.json
              - .dockerignore
              - packages/auth-relay/**
              - packages/infra/tofu/auth*/**
              - packages/infra/tofu/modules/auth-*/**
              - .github/**
            portfolio:
              - packages/portfolio/**
            vault_inputs:
              - packages/infra/tofu/modules/inventory/**
              - packages/infra/tofu/vault/**
  repository:
    name: Repository checks
    if: inputs.service_id == ''
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash scripts/ci/logged-shell.sh {0}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Check branches
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          BASE_REF: ${{ github.event_name == 'merge_group' &&
            github.event.merge_group.base_ref || github.base_ref }}
          HEAD_REF: ${{ github.event_name == 'merge_group' &&
            github.event.merge_group.head_ref || github.head_ref }}
        run: |
          set -euo pipefail
          test "${BASE_REF#refs/heads/}" = main
          test "${HEAD_REF#refs/heads/}" != main
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Check commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bunx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - name: Check PR title
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check TOFU_VAULT_INPUTS against the inventory
        env:
          VAULT_INPUTS_STRICT: ${{ needs.changes.outputs.vault_inputs == 'true' }}
          TOFU_VAULT_INPUTS: ${{ secrets.TOFU_VAULT_INPUTS }}
        run: bun run check:vault-inputs
      - name: Cache formatting results
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/prettier
          key: prettier-v1-${{ runner.os }}-${{ hashFiles('bun.lock', '.prettier*',
            'prettier.config.*', '.editorconfig', 'package.json',
            'packages/*/.prettier*', 'packages/*/prettier.config.*',
            'packages/*/package.json') }}-${{ github.sha }}
          restore-keys: >
            prettier-v1-${{ runner.os }}-${{ hashFiles('bun.lock', '.prettier*',
            'prettier.config.*', '.editorconfig', 'package.json',
            'packages/*/.prettier*', 'packages/*/prettier.config.*',
            'packages/*/package.json') }}-
      - name: Fast repository checks
        run: bun run ci:format && bun run check:agents && bun run check:llms && bun run
          check:scripts
      - name: Install gitleaks from the mise pin
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: '2026.10.24'
          install: false
      - name: Scan new commits for secrets
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha ||
            github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha ||
            github.event.merge_group.head_sha }}
        run: |
          mise install --locked gitleaks
          mise exec --locked gitleaks -- gitleaks git --no-banner --redact --log-opts="$BASE_SHA..$HEAD_SHA" .
      - name: Summarize failure
        if: failure()
        uses: ./.github/actions/failure-summary
        with:
          name: Repository checks
  packages:
    name: Packages (${{ matrix.task }})
    if: inputs.service_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task:
          - quality
          - tests
    env:
      TURBO_CACHE: local:rw
    defaults:
      run:
        shell: bash scripts/ci/logged-shell.sh {0}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Cache task results
        id: tasks_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: turbo-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.task }}-${{
            github.sha }}
          restore-keys: |
            turbo-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.task }}-
      - name: Typecheck and lint packages
        if: matrix.task == 'quality'
        # PRs run only packages affected since the merge base; main runs everything.
        run: bunx turbo run tc lint ${{ github.event_name == 'pull_request' &&
          '--affected' || '' }}
      - name: Set up Atlas
        if: matrix.task == 'tests'
        uses: ariga/setup-atlas@28f0b75814c08b1a265b75713c120cfad46433ae # v0.5
      - name: Plan browser installation
        id: browsers
        if: matrix.task == 'tests'
        run: bun scripts/ci/browser-plan.ts
      - name: Install Chromium (portfolio resume PDF and browser contracts)
        if: matrix.task == 'tests' && steps.browsers.outputs.install == 'true'
        uses: ./.github/actions/browsers
        with:
          packages: |-
            packages/portfolio/node_modules/playwright
            packages/auth-relay/node_modules/@playwright/test
            packages/password-manager/node_modules/playwright
      - name: Install native test dependencies (PDF and encrypted recovery)
        if: matrix.task == 'tests'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils restic python3-yaml
      - name: Test and build packages
        if: matrix.task == 'tests'
        run: bunx turbo run test build test:site ${{ github.event_name == 'pull_request'
          && '--affected' || '' }}
      - name: Save completed task results
        if: always() && !cancelled() && steps.tasks_cache.outputs.cache-primary-key !=
          '' && steps.tasks_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: ${{ steps.tasks_cache.outputs.cache-primary-key }}
      - name: Summarize failure
        if: failure()
        uses: ./.github/actions/failure-summary
        with:
          name: Packages (${{ matrix.task }})
          key: ${{ matrix.task }}
  infra:
    name: OpenTofu (${{ matrix.group }})
    if: needs.changes.outputs.infra == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group:
          - validate
          - modules
          - contracts
    env:
      TF_VAR_state_passphrase: validation-only-passphrase-never-used-for-real-state
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.cache/tofu-providers
    defaults:
      run:
        shell: bash scripts/ci/logged-shell.sh {0}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install dependencies
        if: matrix.group == 'contracts'
        uses: ./.github/actions/setup
      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: 1.13.0
          tofu_wrapper: false
      - name: Set up Atlas
        uses: ariga/setup-atlas@28f0b75814c08b1a265b75713c120cfad46433ae # v0.5
      - name: Cache verified providers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/tofu-providers
          key: tofu-1.13-${{ runner.os }}-${{ runner.arch }}-${{ matrix.group }}-${{
            hashFiles('packages/infra/tofu/**/.terraform.lock.hcl') }}
          restore-keys: |
            tofu-1.13-${{ runner.os }}-${{ runner.arch }}-${{ matrix.group }}-
            tofu-1.13-${{ runner.os }}-${{ runner.arch }}-
      - name: Validate and test OpenTofu
        env:
          CHECK_GROUP: ${{ matrix.group }}
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          bash packages/infra/tofu/check.sh "$CHECK_GROUP"
      - name: Summarize failure
        if: failure()
        uses: ./.github/actions/failure-summary
        with:
          name: OpenTofu (${{ matrix.group }})
          key: ${{ matrix.group }}
  auth:
    name: Auth compatibility (${{ matrix.suite }})
    if: needs.changes.outputs.auth == 'true' && github.event_name != 'pull_request'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite:
          - images
          - compatibility
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Build auth production images concurrently
        if: matrix.suite == 'images'
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6.10.0
        with:
          files: packages/auth-relay/tests/production-bake.hcl
          load: true
          pull: true
      - name: Test production images
        if: matrix.suite == 'images'
        env:
          AUTH_PRODUCTION_PREBUILT: "1"
        run: python3 packages/auth-relay/tests/production-image.py
      - name: Set up Atlas
        if: matrix.suite == 'compatibility'
        uses: ariga/setup-atlas@28f0b75814c08b1a265b75713c120cfad46433ae # v0.5
      - name: Set up OpenTofu
        if: matrix.suite == 'compatibility'
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: 1.13.0
          tofu_wrapper: false
      - name: Build compatibility fixtures
        if: matrix.suite == 'compatibility'
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6.10.0
        with:
          files: packages/auth-relay/tests/docker-bake.hcl
          load: true
          pull: true
      - name: Install Chromium
        if: matrix.suite == 'compatibility'
        uses: ./.github/actions/browsers
        with:
          packages: packages/auth-relay/node_modules/@playwright/test
      - name: Test auth compatibility
        if: matrix.suite == 'compatibility'
        env:
          AUTH_TEST_PREBUILT: "1"
        run: bun run auth:test:e2e
  portfolio_urls:
    name: Portfolio public URLs
    if: needs.changes.outputs.portfolio == 'true' && github.event_name !=
      'pull_request'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Health-check portfolio public URLs
        run: |
          bun run packages/portfolio/scripts/health-check-urls.ts \
            --timeout-ms 30000 --retries 4 --retry-delay-ms 5000
  optional:
    name: Optional integrations
    continue-on-error: true
    if: inputs.service_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Read optional integration credentials
        uses: ./.github/actions/turborepo-vault-secrets
        continue-on-error: true
        with:
          vault_config: dev
          optional: "true"
      - name: Check optional integrations
        continue-on-error: true
        env:
          CI: "true"
          VAULT_CONFIG: dev
          VAULT_PROJECT: personal
        run: bun run --filter @pkgs/turborepo-remote-cache smoke:secrets
  personal_cli:
    name: Personal CLI (${{ matrix.os }}, Node ${{ matrix.node }})
    if: inputs.service_id == '' && github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: '22' }
          - { os: ubuntu-latest, node: '24' }
          - { os: ubuntu-latest, node: '26' }
          - { os: macos-latest, node: '24' }
          - { os: windows-latest, node: '24' }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Test fleet and CLI contracts
        run: bun test packages/fleet/src packages/personal-cli/src packages/personal-cli/tests
      - name: Build standalone Node distribution
        run: bun run personal:build
      - name: Install and exercise the packed consumer anonymously
        run: bun run --cwd packages/personal-cli smoke
  # Required merge gate: the fast lanes only. Slow lanes report in Slow checks.
  check:
    name: Check
    if: always() && inputs.service_id == ''
    needs:
      - changes
      - repository
      - packages
      - infra
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Check validation results
        env:
          RESULTS: ${{ toJSON(needs) }}
          FILTERS: ${{ toJSON(needs.changes.outputs) }}
          REQUIRED: changes repository packages
          CONDITIONAL: infra
        run: >
          set -euo pipefail

          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"

          for job in $REQUIRED; do
            test "$(jq -r --arg job "$job" '.[$job].result' <<< "$RESULTS")" = success
          done

          for job in $CONDITIONAL; do
            filter="$job"
            if [ "$job" = portfolio_urls ]; then filter=portfolio; fi
            expected=$(jq -r --arg filter "$filter" '.[$filter]' <<< "$FILTERS")
            result=$(jq -r --arg job "$job" '.[$job].result' <<< "$RESULTS")
            if [ "$expected" = true ]; then
              test "$result" = success
            elif [ "$expected" = false ]; then
              test "$result" = success || test "$result" = skipped
            else
              echo "Missing or invalid path filter for $job: $expected" >&2
              exit 1
            fi
          done
  # Slow lanes run on main, merge-queue and manual runs, never on PR pushes.
  # Deploy and release wait for them; a failure on main opens an issue.
  slow:
    name: Slow checks
    if: always() && inputs.service_id == '' && github.event_name != 'pull_request'
    needs:
      - changes
      - auth
      - portfolio_urls
      - personal_cli
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Check validation results
        env:
          RESULTS: ${{ toJSON(needs) }}
          FILTERS: ${{ toJSON(needs.changes.outputs) }}
          REQUIRED: personal_cli
          CONDITIONAL: auth portfolio_urls
        run: >
          set -euo pipefail

          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"

          for job in $REQUIRED; do
            test "$(jq -r --arg job "$job" '.[$job].result' <<< "$RESULTS")" = success
          done

          for job in $CONDITIONAL; do
            filter="$job"
            if [ "$job" = portfolio_urls ]; then filter=portfolio; fi
            expected=$(jq -r --arg filter "$filter" '.[$filter]' <<< "$FILTERS")
            result=$(jq -r --arg job "$job" '.[$job].result' <<< "$RESULTS")
            if [ "$expected" = true ]; then
              test "$result" = success
            elif [ "$expected" = false ]; then
              test "$result" = success || test "$result" = skipped
            else
              echo "Missing or invalid path filter for $job: $expected" >&2
              exit 1
            fi
          done
  main_failure:
    name: Report main failure
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && inputs.service_id == ''
    needs:
      - check
      - slow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Open or update the main-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >
          bun scripts/ci/upsert-issue.ts --title "CI failed on main" --label
          ci-failed --body "CI failed on main at ${GITHUB_SHA}: ${RUN_URL}"
  personal_cli_release:
    name: Release personal CLI
    if: "!cancelled() && needs.check.result == 'success' && needs.slow.result == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && inputs.service_id == ''"
    needs:
      - check
      - slow
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: personal-cli-npm-publication
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
      - name: Plan idempotent release
        id: plan
        run: bun packages/personal-cli/scripts/release.ts --plan --github-output
      - name: Validate optional existing credential field selection
        if: steps.plan.outputs.changed == 'true' && vars.PERSONAL_NPM_TOKEN_KEY != ''
        env:
          NPM_KEY: ${{ vars.PERSONAL_NPM_TOKEN_KEY }}
        run: '[[ "$NPM_KEY" =~ ^[A-Z][A-Z0-9_]*$ ]]'
      - name: Read existing npm publishing credential through Vault OIDC
        if: steps.plan.outputs.changed == 'true' && vars.PERSONAL_NPM_TOKEN_KEY != ''
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: https://vault.chrisvouga.dev
          method: jwt
          path: jwt
          role: github-actions
          jwtGithubAudience: https://vault.chrisvouga.dev
          secrets: >-
            secret/data/personal/prd ${{ vars.PERSONAL_NPM_TOKEN_KEY }} | NODE_AUTH_TOKEN
      - name: Validate tarball, publish and verify registry integrity
        if: steps.plan.outputs.changed == 'true'
        env:
          PERSONAL_NPM_PROVENANCE: ${{ github.event.repository.private == false && 'true' || 'false' }}
        run: bun run personal:release --apply --yes ${{ vars.PERSONAL_NPM_TOKEN_KEY == '' && '--oidc' || '' }}
  deploy:
    name: Deploy
    if: "!cancelled() && needs.check.result == 'success' && needs.slow.result ==
      'success' && github.event_name == 'push' && github.ref ==
      'refs/heads/main' && inputs.service_id == ''"
    needs:
      - check
      - slow
    permissions:
      contents: read
      packages: write
      id-token: write
      issues: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
  publish:
    name: Publish
    if: inputs.service_id != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      service_id: ${{ inputs.service_id }}
      dockerfile: ${{ inputs.dockerfile }}
      context: ${{ inputs.context }}
      image_owner: ${{ inputs.image_owner }}
      image_prefix: ${{ inputs.image_prefix }}
      infra_github_repo: ${{ inputs.infra_github_repo }}
      notify_deploy: ${{ inputs.notify_deploy }}
    secrets:
      DEPLOY_DISPATCH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
      CALLER_GITHUB_TOKEN: ${{ secrets.CALLER_GITHUB_TOKEN }}
