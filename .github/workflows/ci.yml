name: CI
on:
  push:
    branches:
      - main
  pull_request: {}
  merge_group: {}
  workflow_dispatch: {}
  workflow_call:
    inputs:
      service_id:
        description: Service id matching OpenTofu inventory (e.g. portfolio, todo-app).
        required: true
        type: string
      dockerfile:
        description: Path to Dockerfile relative to context.
        required: false
        type: string
        default: ./Dockerfile
      context:
        description: Docker build context.
        required: false
        type: string
        default: .
      image_owner:
        description: ghcr.io owner.
        required: false
        type: string
        default: crvouga
      image_prefix:
        description: GHCR package prefix (from OpenTofu inventory image_prefix).
        required: false
        type: string
        default: chrisvouga
      infra_github_repo:
        description: Infra repo owner/name for deploy dispatch.
        required: false
        type: string
        default: crvouga/workspace
      notify_deploy:
        description: POST repository_dispatch to infra after push. Set false when
          chaining deploy.
        required: false
        type: boolean
        default: true
    secrets:
      DEPLOY_DISPATCH_TOKEN:
        description: PAT or GITHUB_TOKEN with repo dispatch to the infra repo.
        required: false
      CALLER_GITHUB_TOKEN:
        description: Caller workflow github.token — GHCR fallback when no platform
          publish token is supplied.
        required: false
      RAILWAY_TOKEN:
        description: Repo secret — vault bootstrap job only (not passed by callers).
        required: false
      CF_API_TOKEN:
        description: Repo secret — vault bootstrap job only (not passed by callers).
        required: false
      DB_CONNECTION_URI:
        description: Repo secret — vault bootstrap job only (not passed by callers).
        required: false
      PLANETSCALE_SERVICE_TOKEN_ID:
        required: false
      PLANETSCALE_SERVICE_TOKEN:
        required: false
      NEON_API_KEY:
        required: false
      TOFU_STATE_PASSPHRASE:
        required: false
      TOFU_STATE_ACCESS_KEY:
        required: false
      TOFU_STATE_SECRET_KEY:
        required: false
      TOFU_VAULT_INPUTS:
        required: false
    outputs:
      image_tag:
        description: Image tag pushed (commit SHA).
        value: ${{ jobs.publish.outputs.image_tag }}
      service_id:
        description: Service id that was published.
        value: ${{ jobs.publish.outputs.service_id }}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  changes:
    name: Plan checks
    if: inputs.service_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      auth: ${{ steps.filter.outputs.auth == 'true' || github.event_name ==
        'workflow_dispatch' }}
      portfolio: ${{ steps.filter.outputs.portfolio == 'true' || github.event_name ==
        'workflow_dispatch' }}
      infra: ${{ steps.filter.outputs.infra == 'true' || github.event_name ==
        'workflow_dispatch' }}
      vault_inputs: ${{ steps.filter.outputs.vault_inputs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Find affected integrations
        id: filter
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.event_name == 'merge_group' &&
            github.event.merge_group.base_sha || '' }}
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha
            || '' }}
          filters: |
            infra:
              - packages/infra/**
              - packages/auth-relay/**
              - scripts/**
              - .github/**
              - package.json
              - bun.lock
            auth:
              - packages/admin-ui/**
              - packages/assert/**
              - packages/logger/**
              - bun.lock
              - package.json
              - .dockerignore
              - packages/auth-relay/**
              - packages/infra/tofu/auth*/**
              - packages/infra/tofu/modules/auth-*/**
              - .github/**
            portfolio:
              - packages/portfolio/**
            vault_inputs:
              - packages/infra/tofu/modules/inventory/**
              - packages/infra/tofu/vault/**
  repository:
    name: Repository checks
    if: inputs.service_id == ''
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check branches
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          BASE_REF: ${{ github.event_name == 'merge_group' &&
            github.event.merge_group.base_ref || github.base_ref }}
          HEAD_REF: ${{ github.event_name == 'merge_group' &&
            github.event.merge_group.head_ref || github.head_ref }}
        run: |
          set -euo pipefail
          test "${BASE_REF#refs/heads/}" = main
          test "${HEAD_REF#refs/heads/}" != main
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Check commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bunx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - name: Check PR title
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check TOFU_VAULT_INPUTS against the inventory
        env:
          VAULT_INPUTS_STRICT: ${{ needs.changes.outputs.vault_inputs == 'true' }}
          TOFU_VAULT_INPUTS: ${{ secrets.TOFU_VAULT_INPUTS }}
        run: bun run check:vault-inputs
      - name: Cache formatting results
        uses: actions/cache@v4
        with:
          path: .cache/prettier
          key: prettier-v1-${{ runner.os }}-${{ hashFiles('bun.lock', '.prettier*',
            'prettier.config.*', '.editorconfig', 'package.json',
            'packages/*/.prettier*', 'packages/*/prettier.config.*',
            'packages/*/package.json') }}-${{ github.sha }}
          restore-keys: >
            prettier-v1-${{ runner.os }}-${{ hashFiles('bun.lock', '.prettier*',
            'prettier.config.*', '.editorconfig', 'package.json',
            'packages/*/.prettier*', 'packages/*/prettier.config.*',
            'packages/*/package.json') }}-
      - name: Fast repository checks
        run: bun run ci:format && bun run check:agents && bun run check:llms && bun run
          check:scripts
  packages:
    name: Packages (${{ matrix.task }})
    if: inputs.service_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task:
          - quality
          - tests
    env:
      TURBO_CACHE: local:rw
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Cache task results
        id: tasks_cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo
          key: turbo-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.task }}-${{
            github.sha }}
          restore-keys: |
            turbo-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.task }}-
      - name: Typecheck and lint packages
        if: matrix.task == 'quality'
        run: bunx turbo run tc lint
      - name: Set up Atlas
        if: matrix.task == 'tests'
        uses: ariga/setup-atlas@v0
      - name: Plan browser installation
        id: browsers
        if: matrix.task == 'tests'
        run: bun scripts/ci/browser-plan.ts
      - name: Install Chromium (portfolio resume PDF and browser contracts)
        if: matrix.task == 'tests' && steps.browsers.outputs.install == 'true'
        uses: ./.github/actions/browsers
        with:
          packages: |-
            packages/portfolio/node_modules/playwright
            packages/auth-relay/node_modules/@playwright/test
            packages/password-manager/node_modules/playwright
      - name: Install poppler (résumé text-layer test)
        if: matrix.task == 'tests'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Test and build packages
        if: matrix.task == 'tests'
        run: bunx turbo run test build test:site
      - name: Save completed task results
        if: always() && !cancelled() && steps.tasks_cache.outputs.cache-primary-key !=
          '' && steps.tasks_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .turbo
          key: ${{ steps.tasks_cache.outputs.cache-primary-key }}
  infra:
    name: OpenTofu (${{ matrix.group }})
    if: needs.changes.outputs.infra == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group:
          - validate
          - modules
          - contracts
    env:
      TF_VAR_state_passphrase: validation-only-passphrase-never-used-for-real-state
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.cache/tofu-providers
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install dependencies
        if: matrix.group == 'contracts'
        uses: ./.github/actions/setup
      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.0
          tofu_wrapper: false
      - name: Set up Atlas
        uses: ariga/setup-atlas@v0
      - name: Cache verified providers
        uses: actions/cache@v4
        with:
          path: .cache/tofu-providers
          key: tofu-1.13-${{ runner.os }}-${{ runner.arch }}-${{ matrix.group }}-${{
            hashFiles('packages/infra/tofu/**/.terraform.lock.hcl') }}
          restore-keys: |
            tofu-1.13-${{ runner.os }}-${{ runner.arch }}-${{ matrix.group }}-
            tofu-1.13-${{ runner.os }}-${{ runner.arch }}-
      - name: Validate and test OpenTofu
        env:
          CHECK_GROUP: ${{ matrix.group }}
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          bash packages/infra/tofu/check.sh "$CHECK_GROUP"
  auth:
    name: Auth compatibility (${{ matrix.suite }})
    if: needs.changes.outputs.auth == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite:
          - images
          - compatibility
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0
      - name: Build auth production images concurrently
        if: matrix.suite == 'images'
        uses: docker/bake-action@v6
        with:
          files: packages/auth-relay/tests/production-bake.hcl
          load: true
          pull: true
      - name: Test production images
        if: matrix.suite == 'images'
        env:
          AUTH_PRODUCTION_PREBUILT: "1"
        run: python3 packages/auth-relay/tests/production-image.py
      - name: Set up Atlas
        if: matrix.suite == 'compatibility'
        uses: ariga/setup-atlas@v0
      - name: Set up OpenTofu
        if: matrix.suite == 'compatibility'
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.0
          tofu_wrapper: false
      - name: Build compatibility fixtures
        if: matrix.suite == 'compatibility'
        uses: docker/bake-action@v6
        with:
          files: packages/auth-relay/tests/docker-bake.hcl
          load: true
          pull: true
      - name: Install Chromium
        if: matrix.suite == 'compatibility'
        uses: ./.github/actions/browsers
        with:
          packages: packages/auth-relay/node_modules/@playwright/test
      - name: Test auth compatibility
        if: matrix.suite == 'compatibility'
        env:
          AUTH_TEST_PREBUILT: "1"
        run: bun run auth:test:e2e
  portfolio_urls:
    name: Portfolio public URLs
    if: needs.changes.outputs.portfolio == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Health-check portfolio public URLs
        run: |
          bun run packages/portfolio/scripts/health-check-urls.ts \
            --timeout-ms 30000 --retries 4 --retry-delay-ms 5000
  optional:
    name: Optional integrations
    continue-on-error: true
    if: inputs.service_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Read optional integration credentials
        uses: ./.github/actions/turborepo-vault-secrets
        continue-on-error: true
        with:
          vault_config: dev
          optional: "true"
      - name: Check optional integrations
        continue-on-error: true
        env:
          CI: "true"
          VAULT_CONFIG: dev
          VAULT_PROJECT: personal
        run: bun run --filter @pkgs/turborepo-remote-cache smoke:secrets
  check:
    name: Check
    if: always() && inputs.service_id == ''
    needs:
      - changes
      - repository
      - packages
      - infra
      - auth
      - portfolio_urls
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Check validation results
        env:
          RESULTS: ${{ toJSON(needs) }}
          FILTERS: ${{ toJSON(needs.changes.outputs) }}
        run: >
          set -euo pipefail

          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"

          for job in changes repository packages; do
            test "$(jq -r --arg job "$job" '.[$job].result' <<< "$RESULTS")" = success
          done

          for job in infra auth portfolio_urls; do
            filter="$job"
            if [ "$job" = portfolio_urls ]; then filter=portfolio; fi
            expected=$(jq -r --arg filter "$filter" '.[$filter]' <<< "$FILTERS")
            result=$(jq -r --arg job "$job" '.[$job].result' <<< "$RESULTS")
            if [ "$expected" = true ]; then
              test "$result" = success
            elif [ "$expected" = false ]; then
              test "$result" = success || test "$result" = skipped
            else
              echo "Missing or invalid path filter for $job: $expected" >&2
              exit 1
            fi
          done
  fleet:
    # Compatibility status required by the existing live GitHub ruleset.
    # Remove after a reviewed foundation apply requires only Check.
    name: Fleet
    if: always() && inputs.service_id == ''
    needs: check
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Report platform validation under the legacy required name
        env:
          CHECK: ${{ needs.check.result }}
        run: test "$CHECK" = success
  Required:
    name: Required
    if: always() && inputs.service_id == '' && (github.event_name == 'pull_request'
      || github.event_name == 'merge_group')
    needs:
      - check
      - fleet
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Check legacy merge status
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
  deploy:
    name: Deploy
    if: "!cancelled() && needs.check.result == 'success' && needs.fleet.result ==
      'success' && github.event_name == 'push' && github.ref ==
      'refs/heads/main' && inputs.service_id == ''"
    needs:
      - check
      - fleet
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
  publish:
    name: Publish
    if: inputs.service_id != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      service_id: ${{ inputs.service_id }}
      dockerfile: ${{ inputs.dockerfile }}
      context: ${{ inputs.context }}
      image_owner: ${{ inputs.image_owner }}
      image_prefix: ${{ inputs.image_prefix }}
      infra_github_repo: ${{ inputs.infra_github_repo }}
      notify_deploy: ${{ inputs.notify_deploy }}
    secrets:
      DEPLOY_DISPATCH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
      CALLER_GITHUB_TOKEN: ${{ secrets.CALLER_GITHUB_TOKEN }}
