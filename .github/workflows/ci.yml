# Production monorepo pipeline; runner-check.yml is a separate opt-in project onboarding entrypoint.
#
#   push (main) / production dispatch .... vault-state → vault? → check → publish? → deploy
#   pull_request / merge_group .......... Required (and Fleet, in fleet.yml) must report
#   workflow_dispatch ...... manual check / publish / vault rebuild / fleet redeploy
#   workflow_call .......... sibling app repos publish their image (was publish-image.yml)
#   repository_dispatch .... sibling publish notify → fleet deploy (deploy-service)
#
# Secrets: GitHub holds bootstrap/application secrets; Vault OIDC loads optional integrations and required cache smoke credentials.

name: CI
run-name: >-
  CI · ${{
    inputs.service_id != '' && github.event_name != 'workflow_dispatch' && github.event_name != 'repository_dispatch' && format('publish · {0}', inputs.service_id) ||
    github.event_name == 'pull_request' && format('PR #{0} · {1}', github.event.pull_request.number, github.head_ref) ||
    github.event_name == 'push' && format('push · {0} · {1}', github.ref_name, github.sha) ||
    github.event_name == 'schedule' && format('schedule · {0}', github.ref_name) ||
    github.event_name == 'repository_dispatch' && format('deploy · {0}', github.event.action) ||
    github.event_name == 'workflow_dispatch' && format('manual · {0}', github.ref_name) ||
    github.event_name
  }}

permissions:
  contents: read
  id-token: write
  packages: write
  pull-requests: read

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.vscode/**'
      - '.cursor/**'
  # Daily portfolio refresh. The site is static, so the GitHub proof data is
  # frozen at image-build time and would otherwise only move when someone
  # happens to push. This run refreshes the committed snapshot and rebuilds the
  # portfolio image (whose build fetches GitHub live), so the heatmap, streak
  # and contribution totals are never more than a day behind. Nothing else in
  # the fleet is touched — see publish-plan.
  schedule:
    - cron: '0 13 * * *' # 13:00 UTC — early morning in America/Los_Angeles
  # No paths-ignore on PRs or the merge queue: `Required` must report on
  # every one. A skipped workflow reports no status and stalls the queue.
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      publish:
        description: Build/push turborepo GHCR image and redeploy
        type: boolean
        default: false
      unseal_only:
        description: Apply the OpenTofu bootstrap root without rebuilding Vault
        type: boolean
        default: false
      service_id:
        description: 'Manual fleet redeploy: single service id (empty = all)'
        required: false
        type: string
      image_tag:
        description: 'Manual fleet redeploy image tag'
        required: false
        type: string
        default: latest
  repository_dispatch:
    types:
      - deploy-service
  workflow_call:
    inputs:
      service_id:
        description: 'Service id matching OpenTofu inventory (e.g. portfolio, todo-app).'
        required: true
        type: string
      dockerfile:
        description: 'Path to Dockerfile relative to context.'
        required: false
        type: string
        default: ./Dockerfile
      context:
        description: 'Docker build context.'
        required: false
        type: string
        default: .
      image_owner:
        description: 'ghcr.io owner.'
        required: false
        type: string
        default: crvouga
      image_prefix:
        description: 'GHCR package prefix (from OpenTofu inventory image_prefix).'
        required: false
        type: string
        default: chrisvouga
      infra_github_repo:
        description: 'Infra repo owner/name for deploy dispatch.'
        required: false
        type: string
        default: crvouga/workspace
      notify_deploy:
        description: 'POST repository_dispatch to infra after push. Set false when chaining deploy.'
        required: false
        type: boolean
        default: true
    secrets:
      DEPLOY_DISPATCH_TOKEN:
        description: 'PAT or GITHUB_TOKEN with repo dispatch to the infra repo.'
        required: false
      CALLER_GITHUB_TOKEN:
        description: 'Caller workflow github.token — required for GHCR push from cross-repo calls.'
        required: false
      RAILWAY_TOKEN:
        description: 'Repo secret — vault bootstrap job only (not passed by callers).'
        required: false
      CF_API_TOKEN:
        description: 'Repo secret — vault bootstrap job only (not passed by callers).'
        required: false
      DB_CONNECTION_URI:
        description: 'Repo secret — vault bootstrap job only (not passed by callers).'
        required: false
      PLANETSCALE_SERVICE_TOKEN_ID:
        required: false
      PLANETSCALE_SERVICE_TOKEN:
        required: false
      NEON_API_KEY:
        required: false
      TOFU_STATE_PASSPHRASE:
        required: false
      TOFU_STATE_ACCESS_KEY:
        required: false
      TOFU_STATE_SECRET_KEY:
        required: false
      TOFU_VAULT_INPUTS:
        required: false
    outputs:
      image_tag:
        description: 'Image tag pushed (commit SHA).'
        value: ${{ jobs.publish.outputs.image_tag }}
      service_id:
        description: 'Service id that was published.'
        value: ${{ jobs.publish.outputs.service_id }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VAULT_ADDR: https://vault.chrisvouga.dev

  TF_VAR_state_passphrase: ${{ secrets.TOFU_STATE_PASSPHRASE }}
  AWS_ACCESS_KEY_ID: ${{ secrets.TOFU_STATE_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.TOFU_STATE_SECRET_KEY }}
  AWS_EC2_METADATA_DISABLED: 'true'
  TF_VAR_state_access_key: ${{ secrets.TOFU_STATE_ACCESS_KEY }}
  TF_VAR_state_secret_key: ${{ secrets.TOFU_STATE_SECRET_KEY }}
  TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
  TF_VAR_cloudflare_api_token: ${{ secrets.CF_API_TOKEN }}
  TF_VAR_railway_token: ${{ secrets.RAILWAY_TOKEN }}
  TF_VAR_planetscale_service_token_id: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
  TF_VAR_planetscale_service_token: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}
  TF_VAR_neon_api_key: ${{ secrets.NEON_API_KEY }}
  TF_VAR_github_token: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
  TF_VAR_vault_inputs: ${{ secrets.TOFU_VAULT_INPUTS }}
  TOFU_VAULT_INPUTS: ${{ secrets.TOFU_VAULT_INPUTS }}
  TOFU_MIGRATION_READY: ${{ vars.TOFU_MIGRATION_READY }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      check: ${{ steps.flags.outputs.check }}
      runner_fleet: ${{ steps.filter.outputs.runner_fleet }}
      vault: ${{ steps.flags.outputs.vault }}
      publish: ${{ steps.flags.outputs.publish }}
      deploy: ${{ steps.flags.outputs.deploy }}
      portfolio: ${{ steps.flags.outputs.portfolio }}
      # Called workflows report the caller's event_name, never workflow_call.
      workflow_call: ${{ steps.flags.outputs.workflow_call }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'merge_group'
        with:
          base: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || '' }}
          filters: |
            check:
              - 'packages/**'
              - 'scripts/**'
              - 'llms.txt'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
              - 'tsconfig.json'
              - 'tsconfig.strict.json'
              - '.prettierrc'
              - '.prettierignore'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            runner_fleet:
              - 'packages/fleet/**'
              - '.github/workflows/runner-check.yml'
              - '.github/workflows/flake-update.yml'
              - '.github/workflows/ci.yml'
            vault:
              - 'packages/vault-service/**'
            portfolio:
              - 'packages/portfolio/**'
            publish:
              - 'packages/turborepo-remote-cache/**'
              - 'packages/portfolio/**'
              - 'packages/fleet-api/**'
              - 'packages/assert/**'
              - 'packages/logger/**'
              - 'packages/object-store/**'
              - 'packages/secret-store/**'
              - 'packages/secret-string/**'
              - 'packages/vault/**'
              - 'packages/eslint-rules/package.json'
              - '.dockerignore'
              - 'bun.lock'
              - 'turbo.json'
              - 'tsconfig.json'
            deploy:
              - 'packages/infra/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/vault-secrets/**'
      - id: flags
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_UNSEAL: ${{ inputs.unseal_only }}
          INPUT_SERVICE_ID: ${{ inputs.service_id }}
          FILTER_CHECK: ${{ steps.filter.outputs.check }}
          FILTER_VAULT: ${{ steps.filter.outputs.vault }}
          FILTER_PUBLISH: ${{ steps.filter.outputs.publish }}
          FILTER_DEPLOY: ${{ steps.filter.outputs.deploy }}
          FILTER_PORTFOLIO: ${{ steps.filter.outputs.portfolio }}
        run: |
          set -euo pipefail
          CHECK=false
          VAULT=false
          PUBLISH=false
          DEPLOY=false
          PORTFOLIO=false
          # github.event_name here is the caller's event (push on a sibling
          # publish). workflow_call is never that value. Sibling publishes are
          # the only runs that pass service_id outside a manual dispatch.
          WORKFLOW_CALL=false
          if [ -n "${INPUT_SERVICE_ID}" ] && \
             [ "${EVENT_NAME}" != "workflow_dispatch" ] && \
             [ "${EVENT_NAME}" != "repository_dispatch" ]; then
            WORKFLOW_CALL=true
          fi

          if [ "${WORKFLOW_CALL}" = "true" ]; then
            # Sibling repo publishes its image through this workflow; nothing else runs.
            PUBLISH=true
          elif [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${INPUT_PUBLISH}" = "true" ]; then
              CHECK=true
              PUBLISH=true
              DEPLOY=true
            fi
            if [ "${INPUT_UNSEAL}" = "true" ]; then
              VAULT=true
              DEPLOY=true
            fi
            if [ -n "${INPUT_SERVICE_ID}" ]; then
              DEPLOY=true
            fi
            # Manual dispatch with no flags: still allow smoke; no gate jobs
          elif [ "${EVENT_NAME}" = "schedule" ]; then
            # Data-freshness run: rebuild and redeploy the portfolio image so it
            # picks up today's GitHub data. No code changed, so `check` is
            # skipped (deploy-prepare tolerates that) and publish-plan narrows
            # the matrix to portfolio alone.
            PUBLISH=true
            DEPLOY=true
            PORTFOLIO=true
          elif [ "${EVENT_NAME}" = "repository_dispatch" ]; then
            DEPLOY=true
          elif [ "${EVENT_NAME}" = "pull_request" ] || [ "${EVENT_NAME}" = "merge_group" ]; then
            # The queue re-runs the same path filter. It must not publish or deploy.
            CHECK="${FILTER_CHECK:-false}"
            PORTFOLIO="${FILTER_PORTFOLIO:-false}"
          else
            # push to main
            CHECK="${FILTER_CHECK:-false}"
            VAULT="${FILTER_VAULT:-false}"
            PUBLISH="${FILTER_PUBLISH:-false}"
            PORTFOLIO="${FILTER_PORTFOLIO:-false}"
            DEPLOY="${FILTER_DEPLOY:-false}"
            if [ "${VAULT}" = "true" ] || [ "${PUBLISH}" = "true" ]; then
              DEPLOY=true
            fi
          fi

          {
            echo "check=${CHECK}"
            echo "vault=${VAULT}"
            echo "publish=${PUBLISH}"
            echo "deploy=${DEPLOY}"
            echo "portfolio=${PORTFOLIO}"
            echo "workflow_call=${WORKFLOW_CALL}"
          } >> "$GITHUB_OUTPUT"
          echo "flags check=${CHECK} vault=${VAULT} publish=${PUBLISH} deploy=${DEPLOY} portfolio=${PORTFOLIO} workflow_call=${WORKFLOW_CALL}"

  vault-state:
    if: |
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'repository_dispatch'
      )
    runs-on: ubuntu-latest
    outputs:
      bootstrap: ${{ steps.health.outputs.bootstrap }}
    steps:
      - id: health
        run: |
          set -euo pipefail
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            "${VAULT_ADDR}/v1/sys/health?standbyok=true&perfstandbyok=true" || true)"
          case "${code}" in
            200|429|472|473)
              echo "Vault is unsealed (HTTP ${code}); bootstrap not required"
              echo "bootstrap=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Vault requires bootstrap (HTTP ${code:-000}); vault job will deploy and unseal it"
              echo "bootstrap=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

  check:
    needs: [changes]
    if: |
      always() &&
      needs.changes.outputs.check == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Chromium (portfolio resume PDF)
        run: |
          cd packages/portfolio
          node node_modules/playwright/cli.js install --with-deps chromium
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.0
          tofu_wrapper: false
      # The fleet-api tests apply packages/fleet-api/schema.hcl to a throwaway
      # PostgreSQL with `atlas schema apply` (ubuntu-latest ships PostgreSQL 16
      # under /usr/lib/postgresql/16/bin).
      - uses: ariga/setup-atlas@v0
      - name: Turbo CI (format, tc, lint, test, build)
        run: bun run check
        env:
          TF_VAR_state_passphrase: validation-only-passphrase-never-used-for-real-state
          TURBO_CACHE: local:rw

  secret-integrations:
    needs: [changes, vault]
    if: always() && needs.changes.outputs.check == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/turborepo-vault-secrets
        with:
          vault_config: dev
          optional: 'true'
      - name: Check optional secret integrations
        env:
          CI: true
          VAULT_CONFIG: dev
          VAULT_PROJECT: personal
        run: bun run --filter @pkgs/turborepo-remote-cache smoke:secrets

  portfolio-health-check:
    needs: [changes]
    if: needs.changes.outputs.portfolio == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Health-check portfolio public URLs
        run: |
          bun run packages/portfolio/scripts/health-check-urls.ts \
            --timeout-ms 30000 \
            --retries 4 \
            --retry-delay-ms 5000

  # Moves the *committed* fallback forward. The publish job below independently
  # rebuilds the image (whose build fetches GitHub live), so the live site is
  # fresh either way; this job exists so the offline snapshot — the thing that
  # keeps the site up when GitHub is down — cannot quietly rot to months old.
  #
  # It lands through a self-merging PR rather than a push, because the `main`
  # ruleset requires a pull request and has no bypass actors. The branch is a
  # fixed one, force-pushed onto current main each day, so a day whose CI failed
  # is corrected by the next run instead of piling up branches.
  #
  # DEPLOY_DISPATCH_TOKEN, not GITHUB_TOKEN: a PR opened with the default token
  # does not trigger `on: pull_request`, so `Required` would never report and
  # auto-merge would wait forever.
  #
  # Deliberately not a dependency of publish: if the GitHub token expires, this
  # job goes red while the build carries on serving the last good snapshot.
  # That is the intended split — a visible alarm, not an outage.
  refresh-github-insights:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      REFRESH_BRANCH: chore/github-insights-refresh
      SNAPSHOT: packages/portfolio/src/data/github-insights.json
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Import Vault secrets
        uses: ./.github/actions/turborepo-vault-secrets
        with:
          vault_config: prd
          optional: 'true'
      - name: Refresh GitHub snapshot
        id: refresh
        working-directory: packages/portfolio
        run: bun run refresh-github
      - name: Open a self-merging PR for the refreshed snapshot
        if: steps.refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          TITLE: 'chore(portfolio): refresh GitHub insights snapshot'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "${REFRESH_BRANCH}"
          git add "${SNAPSHOT}"
          git commit -m "${TITLE}"
          git push --force origin "${REFRESH_BRANCH}"

          if [ -z "$(gh pr list --head "${REFRESH_BRANCH}" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --base main \
              --head "${REFRESH_BRANCH}" \
              --title "${TITLE}" \
              --body 'Automated daily refresh of the committed GitHub proof snapshot, the offline fallback rendered when GitHub is unreachable at build time. Opened by the `refresh-github-insights` job in ci.yml.'
          fi
          gh pr merge "${REFRESH_BRANCH}" --auto --merge

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Lint PR commit messages (Conventional Commits)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bunx commitlint --from "${BASE_SHA}" --to "${HEAD_SHA}" --verbose

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  runner-fleet:
    needs: [changes]
    if: needs.changes.outputs.runner_fleet == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Portable checks
        working-directory: packages/fleet
        run: nix develop --command bash scripts/check.sh

  # Required status check for the `main` ruleset (scripts/pr-ready).
  # Path-filtered jobs may be skipped; anything else must succeed.
  # The merge queue re-runs this job. commitlint and pr-title stay on the PR.
  Required:
    needs: [changes, check, portfolio-health-check, commitlint, pr-title, runner-fleet]
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify branches and needed job results
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_ref || github.base_ref }}
          HEAD_REF: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_ref || github.head_ref }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          base="${BASE_REF#refs/heads/}"
          head="${HEAD_REF#refs/heads/}"
          if [ "${base}" != "main" ]; then
            echo "::error::base must be main, got ${BASE_REF}"
            exit 1
          fi
          if [ "${head}" = "main" ]; then
            echo "::error::head must not be main"
            exit 1
          fi
          bad="$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"' <<< "${RESULTS}")"
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "${RESULTS}"
          if [ -n "${bad}" ]; then
            echo "::error::required jobs did not succeed: ${bad//$'\n'/, }"
            exit 1
          fi
          # changes always runs. commitlint and pr-title run on the pull request.
          must_succeed=(changes)
          if [ "${EVENT}" = "pull_request" ]; then
            must_succeed+=(commitlint pr-title)
          fi
          for job in "${must_succeed[@]}"; do
            result="$(jq -r --arg job "${job}" '.[$job].result' <<< "${RESULTS}")"
            if [ "${result}" != "success" ]; then
              echo "::error::${job} must succeed, got ${result}"
              exit 1
            fi
          done

  publish-plan:
    needs: [changes]
    if: needs.changes.outputs.publish == 'true'
    runs-on: ubuntu-latest
    outputs:
      service_ids: ${{ steps.plan.outputs.service_ids }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        if: needs.changes.outputs.workflow_call != 'true'
      - run: bun install --frozen-lockfile
        if: needs.changes.outputs.workflow_call != 'true'
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_CALL: ${{ needs.changes.outputs.workflow_call }}
          IN_SERVICE_ID: ${{ inputs.service_id }}
        run: |
          set -euo pipefail
          if [ "${WORKFLOW_CALL}" = "true" ]; then
            echo "service_ids=[\"${IN_SERVICE_ID}\"]" >> "$GITHUB_OUTPUT"
          elif [ "${EVENT_NAME}" = "schedule" ]; then
            # The daily run exists only to refresh portfolio's GitHub data.
            # Rebuilding the rest of the fleet on a timer would be pure churn.
            echo 'service_ids=["portfolio"]' >> "$GITHUB_OUTPUT"
          else
            echo "service_ids=$(bun run packages/infra/scripts/list-publish-service-ids.ts)" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: [changes, publish-plan]
    if: |
      always() &&
      needs.changes.outputs.publish == 'true' &&
      needs.publish-plan.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service_id: ${{ fromJson(needs.publish-plan.outputs.service_ids) }}
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
      service_id: ${{ steps.resolve.outputs.service_id }}
    steps:
      - id: tag
        run: echo "image_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5

      # The publish inputs come from OpenTofu inventory, so the job needs the workspace
      # toolchain (sibling workflow_call publishes pass their inputs directly).
      - uses: oven-sh/setup-bun@v2
        if: needs.changes.outputs.workflow_call != 'true'
      - run: bun install --frozen-lockfile
        if: needs.changes.outputs.workflow_call != 'true'

      - name: Resolve build inputs
        id: resolve
        env:
          WORKFLOW_CALL: ${{ needs.changes.outputs.workflow_call }}
          IN_SERVICE_ID: ${{ inputs.service_id }}
          IN_DOCKERFILE: ${{ inputs.dockerfile }}
          IN_CONTEXT: ${{ inputs.context }}
          IN_OWNER: ${{ inputs.image_owner }}
          IN_PREFIX: ${{ inputs.image_prefix }}
          IN_NOTIFY: ${{ inputs.notify_deploy }}
          MATRIX_SERVICE_ID: ${{ matrix.service_id }}
        run: |
          set -euo pipefail
          if [ "${WORKFLOW_CALL}" = "true" ]; then
            SID="${IN_SERVICE_ID}"
            for v in "${SID}" "${IN_DOCKERFILE}" "${IN_CONTEXT}" "${IN_OWNER}" "${IN_PREFIX}"; do
              if [ -z "${v}" ]; then
                echo "::error::publish inputs must be non-empty" >&2
                exit 1
              fi
            done
            {
              echo "service_id=${SID}"
              echo "dockerfile=${IN_DOCKERFILE}"
              echo "context=${IN_CONTEXT}"
              echo "image_owner=${IN_OWNER}"
              echo "image_prefix=${IN_PREFIX}"
              echo "notify_deploy=${IN_NOTIFY}"
            } >> "$GITHUB_OUTPUT"
          else
            SID="${MATRIX_SERVICE_ID}"
            bun run packages/infra/scripts/print-publish-inputs.ts --id "${SID}" >> "$GITHUB_OUTPUT"
            echo "service_id=${SID}" >> "$GITHUB_OUTPUT"
            echo "notify_deploy=false" >> "$GITHUB_OUTPUT"
          fi
          echo "publish service=${SID}"

      - name: Resolve GHCR credentials
        id: ghcr_auth
        env:
          DISPATCH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          CALLER_TOKEN: ${{ secrets.CALLER_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if { [ "${GITHUB_REPOSITORY}" = "crvouga/infra" ] || [ "${GITHUB_REPOSITORY}" = "crvouga/workspace" ]; } && [ -n "${DISPATCH_TOKEN}" ]; then
            echo "username=${{ steps.resolve.outputs.image_owner }}" >> "$GITHUB_OUTPUT"
            echo "password=${DISPATCH_TOKEN}" >> "$GITHUB_OUTPUT"
          elif [ -n "${CALLER_TOKEN}" ]; then
            echo "username=${{ github.actor }}" >> "$GITHUB_OUTPUT"
            echo "password=${CALLER_TOKEN}" >> "$GITHUB_OUTPUT"
          else
            echo "username=${{ github.actor }}" >> "$GITHUB_OUTPUT"
            echo "password=${{ github.token }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to ghcr.io
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ steps.ghcr_auth.outputs.username }}
          password: ${{ steps.ghcr_auth.outputs.password }}

      - uses: docker/setup-buildx-action@v4.0.0

      - name: Import Vault secrets (portfolio)
        if: matrix.service_id == 'portfolio'
        uses: ./.github/actions/turborepo-vault-secrets
        with:
          vault_config: prd
          optional: 'true'

      - name: Build and push (portfolio)
        if: matrix.service_id == 'portfolio'
        uses: docker/build-push-action@v7.2.0
        with:
          context: ${{ steps.resolve.outputs.context }}
          file: ${{ steps.resolve.outputs.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ steps.resolve.outputs.image_owner }}/${{ steps.resolve.outputs.image_prefix }}-${{ steps.resolve.outputs.service_id }}:latest
            ghcr.io/${{ steps.resolve.outputs.image_owner }}/${{ steps.resolve.outputs.image_prefix }}-${{ steps.resolve.outputs.service_id }}:${{ github.sha }}
          secret-envs: |
            github_token=PORTFOLIO_GITHUB_TOKEN

      - name: Build and push
        if: matrix.service_id != 'portfolio'
        uses: docker/build-push-action@v7.2.0
        with:
          context: ${{ steps.resolve.outputs.context }}
          file: ${{ steps.resolve.outputs.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ steps.resolve.outputs.image_owner }}/${{ steps.resolve.outputs.image_prefix }}-${{ steps.resolve.outputs.service_id }}:latest
            ghcr.io/${{ steps.resolve.outputs.image_owner }}/${{ steps.resolve.outputs.image_prefix }}-${{ steps.resolve.outputs.service_id }}:${{ github.sha }}

      - name: Notify infra deploy
        if: steps.resolve.outputs.notify_deploy == 'true'
        env:
          DISPATCH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          INFRA_REPO: ${{ inputs.infra_github_repo }}
        run: |
          set -euo pipefail
          if [ -z "${DISPATCH_TOKEN}" ]; then
            echo "ERROR: DEPLOY_DISPATCH_TOKEN is not set on this repo" >&2
            echo "Apply the OpenTofu foundation root to provision repository dispatch secrets." >&2
            exit 1
          fi
          HTTP=$(curl -sS -o /tmp/dispatch-body.txt -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${INFRA_REPO}/dispatches" \
            -d "{\"event_type\":\"deploy-service\",\"client_payload\":{\"id\":\"${{ steps.resolve.outputs.service_id }}\",\"image_tag\":\"${{ github.sha }}\"}}")
          if [ "${HTTP}" -ge 200 ] && [ "${HTTP}" -lt 300 ]; then
            echo "Dispatched deploy-service for ${{ steps.resolve.outputs.service_id }}@${{ github.sha }}"
            exit 0
          fi
          echo "Deploy dispatch failed (HTTP ${HTTP}):" >&2
          cat /tmp/dispatch-body.txt >&2
          if [ "${HTTP}" = "403" ]; then
            echo "Set DEPLOY_DISPATCH_TOKEN on this repo (GITHUB_TOKEN_SUPER PAT with repo scope)." >&2
          fi
          exit 1

  vault:
    needs: [changes, vault-state]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      (
        needs.changes.outputs.vault == 'true' ||
        inputs.unseal_only == true ||
        needs.vault-state.outputs.bootstrap == 'true'
      )
    runs-on: ubuntu-latest
    concurrency:
      group: vault-${{ github.ref }}
      cancel-in-progress: false
    env:
      VAULT_ADDR: https://vault.chrisvouga.dev
      VAULT_HOSTNAME: vault.chrisvouga.dev
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      DB_CONNECTION_URI: ${{ secrets.DB_CONNECTION_URI }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      DEPLOY_DISPATCH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - uses: docker/setup-buildx-action@v4.0.0
        if: inputs.unseal_only != true

      - name: Log in to ghcr.io
        if: inputs.unseal_only != true
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: crvouga
          password: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}

      - name: Build and push
        if: inputs.unseal_only != true
        uses: docker/build-push-action@v7.2.0
        with:
          context: packages/vault-service
          file: packages/vault-service/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/crvouga/workspace
            org.opencontainers.image.description=Standalone OpenBao vault for chrisvouga.dev
          tags: |
            ghcr.io/crvouga/chrisvouga-vault:latest
            ghcr.io/crvouga/chrisvouga-vault:${{ github.sha }}

      - uses: ./.github/actions/tofu
        if: inputs.unseal_only != true
        with:
          root: foundation
          vault_image_tag: ${{ github.sha }}
      - uses: ./.github/actions/tofu
        with:
          root: bootstrap
      - uses: ./.github/actions/tofu
        with:
          root: vault
      - name: Health-check vault
        run: bun run health-check --id vault

  # Fleet deploy: resolve → OpenTofu foundation/bootstrap/vault → OpenTofu fleet → health-check-all
  deploy-prepare:
    needs: [changes, check, vault, publish, publish-plan]
    if: |
      always() &&
      needs.changes.outputs.deploy == 'true' &&
      (needs.check.result == 'success' || needs.check.result == 'skipped') &&
      (needs.vault.result == 'success' || needs.vault.result == 'skipped') &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      service_ids: ${{ steps.resolve.outputs.service_ids }}
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      redeploy: ${{ steps.resolve.outputs.redeploy }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_CALL: ${{ needs.changes.outputs.workflow_call }}
          CLIENT_ID: ${{ github.event.client_payload.id }}
          CLIENT_IMAGE_TAG: ${{ github.event.client_payload.image_tag }}
          INPUT_SERVICE_ID: ${{ inputs.service_id }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          PUBLISH_TARGETS: ${{ needs.publish-plan.outputs.service_ids }}
        run: |
          set -euo pipefail
          # A monorepo publish in this run redeploys exactly the services it built.
          if [ "${PUBLISH_RESULT}" = "success" ] && [ "${WORKFLOW_CALL}" != "true" ]; then
            SERVICE_IDS="${PUBLISH_TARGETS}"
            TAG="${GITHUB_SHA}"
            REDEPLOY=true
          else
            SID="${CLIENT_ID:-${INPUT_SERVICE_ID:-}}"
            if [ -n "${SID}" ]; then
              SERVICE_IDS="$(bun run packages/infra/scripts/list-deploy-service-ids.ts --id "${SID}")"
            else
              SERVICE_IDS="$(bun run packages/infra/scripts/list-deploy-service-ids.ts)"
            fi
            TAG="${CLIENT_IMAGE_TAG:-${INPUT_IMAGE_TAG:-latest}}"
            REDEPLOY=false
            if [ "${EVENT_NAME}" = "repository_dispatch" ] || \
               [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
              REDEPLOY=true
            fi
          fi

          {
            echo "service_ids=${SERVICE_IDS}"
            echo "image_tag=${TAG}"
            echo "redeploy=${REDEPLOY}"
          } >> "$GITHUB_OUTPUT"
          echo "Deploy: services=${SERVICE_IDS} image_tag='${TAG}' redeploy=${REDEPLOY}"

  deploy-reconcile:
    runs-on: ubuntu-latest
    needs: [deploy-prepare]
    if: always() && needs.deploy-prepare.result == 'success'
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/tofu
        with:
          root: foundation
      - uses: ./.github/actions/tofu
        with:
          root: bootstrap
      - uses: ./.github/actions/tofu
        with:
          root: vault

  deploy-railway:
    runs-on: ubuntu-latest
    needs: [deploy-prepare, deploy-reconcile]
    if: always() && needs.deploy-prepare.result == 'success' && needs.deploy-reconcile.result == 'success'
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/tofu
        with:
          root: fleet
          service_ids: ${{ needs.deploy-prepare.outputs.service_ids }}
          image_tag: ${{ needs.deploy-prepare.outputs.redeploy == 'true' && needs.deploy-prepare.outputs.image_tag || '' }}

  health-check-all:
    runs-on: ubuntu-latest
    needs: [deploy-prepare, deploy-reconcile, deploy-railway]
    if: |
      always() &&
      needs.deploy-prepare.result == 'success' &&
      needs.deploy-reconcile.result == 'success' &&
      (needs.deploy-railway.result == 'success' || needs.deploy-railway.result == 'skipped')
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run packages/infra/scripts/print-platform-env.ts --format github >> "$GITHUB_ENV"
      - name: Health-check all public services
        run: bun run health-check --all-public

  smoke:
    runs-on: ubuntu-latest
    needs:
      [
        changes,
        vault-state,
        check,
        vault,
        publish,
        deploy-prepare,
        deploy-reconcile,
        deploy-railway,
        health-check-all,
      ]
    # Production smoke follows health checks on pushes and production
    # dispatches; never probe production from PRs or sibling publish calls.
    # Sibling calls keep the caller's event_name, so use the changes output.
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      needs.changes.outputs.workflow_call != 'true' &&
      needs.changes.result == 'success' &&
      (needs.vault-state.result == 'success' || needs.vault-state.result == 'skipped') &&
      (needs.check.result == 'success' || needs.check.result == 'skipped') &&
      (needs.vault.result == 'success' || needs.vault.result == 'skipped') &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped') &&
      (needs.deploy-prepare.result == 'success' || needs.deploy-prepare.result == 'skipped') &&
      (needs.deploy-reconcile.result == 'success' || needs.deploy-reconcile.result == 'skipped') &&
      (needs.deploy-railway.result == 'success' || needs.deploy-railway.result == 'skipped') &&
      (needs.health-check-all.result == 'success' || needs.health-check-all.result == 'skipped')
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Import Vault secrets (prd)
        uses: ./.github/actions/turborepo-vault-secrets
        with:
          vault_config: prd
      - name: Smoke test remote cache
        env:
          CI: true
          GITHUB_ACTIONS: true
          VAULT_CONFIG: prd
          VAULT_PROJECT: personal
        run: bun run --filter @pkgs/turborepo-remote-cache smoke
