name: Publish
on:
  workflow_call:
    inputs:
      service_id:
        description: Service id matching OpenTofu inventory (e.g. portfolio, todo-app).
        required: true
        type: string
      dockerfile:
        description: Path to Dockerfile relative to context.
        required: false
        type: string
        default: ./Dockerfile
      context:
        description: Docker build context.
        required: false
        type: string
        default: .
      image_owner:
        description: ghcr.io owner.
        required: false
        type: string
        default: crvouga
      image_prefix:
        description: GHCR package prefix (from OpenTofu inventory image_prefix).
        required: false
        type: string
        default: chrisvouga
      infra_github_repo:
        description: Infra repo owner/name for deploy dispatch.
        required: false
        type: string
        default: crvouga/workspace
      notify_deploy:
        description: POST repository_dispatch to infra after push. Set false when
          chaining deploy.
        required: false
        type: boolean
        default: true
    secrets:
      DEPLOY_DISPATCH_TOKEN:
        description: PAT or GITHUB_TOKEN with repo dispatch to the infra repo.
        required: false
      CALLER_GITHUB_TOKEN:
        description: Caller workflow github.token — GHCR fallback when no platform
          publish token is supplied.
        required: false
    outputs:
      image_tag:
        description: Image tag pushed (commit SHA).
        value: ${{ jobs.publish.outputs.image_tag }}
      service_id:
        description: Service id that was published.
        value: ${{ jobs.publish.outputs.service_id }}
permissions:
  contents: read
  packages: write
defaults:
  run:
    shell: bash
jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_tag: ${{ github.sha }}
      service_id: ${{ inputs.service_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Check inputs
        env:
          BUILD_INPUTS: ${{ toJSON(inputs) }}
        run: >
          jq -e 'all(.service_id, .dockerfile, .context, .image_owner,
          .image_prefix; type == "string" and length > 0)' <<< "$BUILD_INPUTS"
      - name: Resolve GHCR credentials
        id: ghcr_auth
        env:
          DISPATCH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          CALLER_TOKEN: ${{ secrets.CALLER_GITHUB_TOKEN }}
          IMAGE_OWNER: ${{ inputs.image_owner }}
          ACTOR: ${{ github.actor }}
          WORKFLOW_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Existing packages may be linked to another repository, so the
          # caller's repository-scoped token cannot necessarily update them.
          if [ -n "${DISPATCH_TOKEN}" ]; then
            echo "username=${IMAGE_OWNER}" >> "$GITHUB_OUTPUT"
            echo "password=${DISPATCH_TOKEN}" >> "$GITHUB_OUTPUT"
          elif [ -n "${CALLER_TOKEN}" ]; then
            echo "username=${ACTOR}" >> "$GITHUB_OUTPUT"
            echo "password=${CALLER_TOKEN}" >> "$GITHUB_OUTPUT"
          else
            echo "username=${ACTOR}" >> "$GITHUB_OUTPUT"
            echo "password=${WORKFLOW_TOKEN}" >> "$GITHUB_OUTPUT"
          fi
      - name: Log in to ghcr.io
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ steps.ghcr_auth.outputs.username }}
          password: ${{ steps.ghcr_auth.outputs.password }}
      - name: Set up Docker
        uses: docker/setup-buildx-action@v4.0.0
      - name: Build and push
        uses: docker/build-push-action@v7.2.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          pull: true
          cache-from: type=registry,ref=ghcr.io/${{ inputs.image_owner }}/${{
            inputs.image_prefix }}-${{ inputs.service_id }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ inputs.image_owner }}/${{
            inputs.image_prefix }}-${{ inputs.service_id
            }}:buildcache,mode=max,ignore-error=true
          tags: >
            ghcr.io/${{ inputs.image_owner }}/${{ inputs.image_prefix }}-${{
            inputs.service_id }}:latest

            ghcr.io/${{ inputs.image_owner }}/${{ inputs.image_prefix }}-${{
            inputs.service_id }}:${{ github.sha }}
      - name: Notify deployment
        if: inputs.notify_deploy
        env:
          DISPATCH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          INFRA_REPO: ${{ inputs.infra_github_repo }}
          SERVICE_ID: ${{ inputs.service_id }}
          IMAGE_TAG: ${{ github.sha }}
        run: >
          set -euo pipefail

          if [ -z "${DISPATCH_TOKEN}" ]; then
            echo "ERROR: DEPLOY_DISPATCH_TOKEN is not set on this repo" >&2
            echo "Apply the OpenTofu foundation root to provision repository dispatch secrets." >&2
            exit 1
          fi

          HTTP=$(curl -sS -o /tmp/dispatch-body.txt -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${INFRA_REPO}/dispatches" \
            -d "$(jq -nc --arg id "$SERVICE_ID" --arg tag "$IMAGE_TAG" '{event_type:"deploy-service",client_payload:{id:$id,image_tag:$tag}}')")
          if [ "${HTTP}" -ge 200 ] && [ "${HTTP}" -lt 300 ]; then
            echo "Dispatched deploy-service for ${SERVICE_ID}@${IMAGE_TAG}"
            exit 0
          fi

          echo "Deploy dispatch failed (HTTP ${HTTP}):" >&2

          cat /tmp/dispatch-body.txt >&2

          if [ "${HTTP}" = "403" ]; then
            echo "Set DEPLOY_DISPATCH_TOKEN on this repo (GITHUB_TOKEN_SUPER PAT with repo scope)." >&2
          fi

          exit 1
