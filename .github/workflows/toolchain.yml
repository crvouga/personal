name: Developer toolchain
on:
  pull_request:
    paths:
      - mise.toml
      - mise.lock
      - .mise/locks/**
      - scripts/dev/**
      - packages/workstation/**
      - .github/workflows/toolchain.yml
  push:
    branches: [main]
    paths:
      - mise.toml
      - mise.lock
      - .mise/locks/**
      - scripts/dev/**
      - packages/workstation/**
      - .github/workflows/toolchain.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  smoke:
    name: Locked tools (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
      CI: 'true'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: '2026.10.24'
          install: false
      - name: Install shared tools from lockfile
        run: mise install --locked
      - name: Test bootstrap safety and doctor behavior
        run: mise exec --locked -- bun test ./scripts/dev
      - name: Remove bundled AWS CLI from hosted Windows runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Hosted images can ship a newer MSI that blocks our pinned version.
          # Keep this reset in CI; never uninstall a developer's tools in setup.
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Expected a disposable hosted runner.' }
          $products = @(Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' |
            Where-Object { $_.DisplayName -eq 'AWS Command Line Interface v2' })
          foreach ($product in $products) {
            $code = $product.PSChildName
            if ($code -notmatch '^\{[0-9a-fA-F-]{36}\}$') { throw 'Unexpected AWS MSI product code.' }
            Write-Host "Removing bundled AWS CLI $($product.DisplayVersion)"
            $process = Start-Process msiexec.exe -ArgumentList @('/x', $code, '/qn', '/norestart') -Wait -PassThru
            if ($process.ExitCode -notin @(0, 3010)) { throw "AWS MSI uninstall failed ($($process.ExitCode))." }
          }
      - name: Apply managed global configuration
        run: mise exec --locked -- bun scripts/dev/setup.ts --tools-only
      - name: Verify actual tool versions
        run: mise exec --locked -- bun scripts/dev/doctor.ts --json
      - name: Verify tools outside the checkout
        working-directory: ${{ runner.temp }}
        run: mise exec --locked -- bun "${{ github.workspace }}/scripts/dev/doctor.ts" --json
      - name: Check Bash entry point
        if: runner.os != 'Windows'
        run: mise exec --locked -- shellcheck scripts/dev/bootstrap.sh
      - name: Check PowerShell entry point parses
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/dev/bootstrap.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
