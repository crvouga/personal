name: Fleet flake lock

# Opens one pull request. It still has to pass Fleet and the merge queue.
# This workflow does not push main.
on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Update packages/fleet/flake.lock and open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          nix flake update --flake packages/fleet
          if git diff --quiet -- packages/fleet/flake.lock; then
            echo 'flake.lock is unchanged'
            exit 0
          fi
          branch=chore/fleet-flake-lock
          git checkout -B "${branch}"
          git add -- packages/fleet/flake.lock
          git commit -m 'chore(fleet): update flake.lock'
          if git fetch origin "${branch}"; then
            git push --force-with-lease="refs/heads/${branch}:refs/remotes/origin/${branch}" origin "HEAD:refs/heads/${branch}"
          else
            git push origin "HEAD:refs/heads/${branch}"
          fi
          if [ -z "$(gh pr list --head "${branch}" --base main --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --base main \
              --head "${branch}" \
              --title 'chore(fleet): update flake.lock' \
              --body 'Weekly Nix input update for packages/fleet. It goes through the fleet checks and the merge queue. Do not push it to main directly.'
          fi
