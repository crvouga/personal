name: Fleet

# GitHub-hosted runners only. A broken fleet must still be able to ship a fix.
# No path filter on `on:`. A skipped workflow reports no status, and a required
# check that never reports stalls the merge queue. `Fleet` always reports.
# There is no post-merge cache job. The ruleset merge queue uses MERGE, so the
# merge_group head is the commit that lands on main and the cache key matches
# system.configurationRevision. Squash or rebase would not.
# push to main publishes the installer release even when the merge queue is not
# enabled for the repository. With the queue, the merge_group run publishes first
# and this run replaces it with the same bytes.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      fleet: ${{ steps.filter.outputs.fleet == 'true' || steps.release.outputs.missing == 'true' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push'
        with:
          base: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || '' }}
          filters: |
            fleet:
              - 'packages/fleet/**'
              - '.github/workflows/fleet.yml'
              - '.github/workflows/flake-update.yml'
              - '.github/workflows/fleet-enroll.yml'
              - 'packages/fleet/workflows/fleet.yml'
      # A failed first publication must not leave /add broken indefinitely while
      # unrelated pushes report green. Retry the full checks and publication.
      - name: Check that the installer release is complete
        id: release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=$(gh release view fleet-installer --json assets --jq '.assets[].name') || assets=''
          for asset in \
            fleet-installer.iso.parts.json fleet-installer.iso.sha256 fleet-installer.iso.part-000 fleet-node.sh \
            fleet-installer-windows-x64.exe \
            fleet-installer-macos-arm64.zip fleet-installer-macos-x64.zip \
            fleet-installer-linux-arm64.tar.gz fleet-installer-linux-x64.tar.gz; do
            if ! grep -Fxq "$asset" <<< "$assets"; then
              echo "Installer release is missing $asset; rebuilding and publishing."
              echo 'missing=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo 'missing=false' >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.fleet == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        group: [roles, runtime, lifecycle, image]
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Build this group of flake checks
        working-directory: packages/fleet
        env:
          CHECK_GROUP: ${{ matrix.group }}
        # Two simultaneous QEMU tests per 16 GB runner. Every flake check is
        # assigned once; new checks automatically join the roles group.
        run: python3 scripts/ci-checks.py "$CHECK_GROUP"
      - uses: actions/upload-artifact@v4
        if: matrix.group == 'image' && github.event_name != 'pull_request'
        with:
          name: fleet-installer
          path: packages/fleet/result-iso/iso/fleet-installer.iso
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # The installer wizard is a program people download and double-click, so it is
  # built and proven on every platform it ships for. Each build must pass its own
  # --selftest (page bundled, server up, auth enforced, helper relaunch, write and
  # read back) before it can be published.
  wizard:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.fleet == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            ubuntu-latest,
            ubuntu-24.04-arm,
            macos-latest,
            macos-15-intel,
            windows-latest,
          ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - name: Wizard tests
        working-directory: packages/fleet
        run: python -B -m unittest discover -s tests -p "test_wizard.py" -v
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install only Fleet browser dependencies
        run: |
          bun install --frozen-lockfile --filter '@pkgs/fleet'
          cd packages/fleet
          bunx playwright install --with-deps chromium
      - name: Click through the wizard page in a real browser
        working-directory: packages/fleet
        shell: bash
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
          PLAYWRIGHT_PATH: '@playwright/test'
        run: node wizard/ui-e2e.cjs
      - name: Build the installer and run its self-test
        working-directory: packages/fleet
        run: |
          python -m pip install "pyinstaller>=6,<7"
          python wizard/build.py --version "${{ github.sha }}"
      - name: Select the packaged installer for browser acceptance
        working-directory: packages/fleet
        run: python bdd/packaged.py
      - name: Gherkin acceptance against the packaged installer
        env:
          FLEET_BDD_EXPECT_VERSION: ${{ github.sha }}
          PYTHON: ${{ steps.python.outputs.python-path }}
        working-directory: packages/fleet
        # Typecheck and BDD lint run once in CI's monorepo check.
        run: bun run test:bdd:local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fleet-bdd-${{ matrix.os }}
          path: |
            packages/fleet/dist/bdd-report/
            packages/fleet/dist/bdd-results/
            packages/fleet/dist/bdd-results.json
          if-no-files-found: error
          retention-days: 14
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        if: startsWith(matrix.os, 'ubuntu-')
      - name: Native Nix installer and Gherkin acceptance
        if: startsWith(matrix.os, 'ubuntu-')
        working-directory: packages/fleet
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
          FLEET_BDD_EXPECT_VERSION: ${{ github.sha }}
          FLEET_BDD_OUTPUT_DIR: dist/bdd-native-results
          PLAYWRIGHT_HTML_OUTPUT_DIR: dist/bdd-native-report
          PLAYWRIGHT_JSON_OUTPUT_FILE: dist/bdd-native-results.json
        run: |
          nix build --no-write-lock-file -o result-native '.#fleet-installer'
          result-native/bin/fleet-installer --selftest
          FLEET_BDD_WIZARD="$PWD/result-native/bin/fleet-installer" bun run test:bdd:local
      - uses: actions/upload-artifact@v4
        if: always() && startsWith(matrix.os, 'ubuntu-')
        with:
          name: fleet-bdd-native-${{ matrix.os }}
          path: |
            packages/fleet/dist/bdd-native-report/
            packages/fleet/dist/bdd-native-results/
            packages/fleet/dist/bdd-native-results.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: wizard-${{ matrix.os }}
          path: packages/fleet/wizard/dist/*
          if-no-files-found: error
          retention-days: 14

  # Actions artifacts expire. The release asset is the copy a new machine
  # downloads. pull_request skips this job; merge_group, push to main and
  # workflow_dispatch publish it. The gate requires that publish when a fleet change merges.
  publish:
    needs: [changes, check, wizard]
    if: always() && needs.check.result == 'success' && needs.wizard.result == 'success' && github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.fleet == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: fleet-installer
          path: installer-artifact
      - uses: actions/download-artifact@v4
        with:
          pattern: wizard-*
          path: wizard-artifacts
          merge-multiple: true
      - name: Publish the installer and the one-file node entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          iso=$(find installer-artifact -type f -name 'fleet-installer.iso' -print -quit)
          test -n "$iso"
          # The offline image contains every role and exceeds the 2 GiB asset
          # limit. Clients assemble verified 1 GiB parts into one local ISO.
          python3 packages/fleet/scripts/release-image.py "$iso" image-assets
          cp packages/fleet/scripts/fleet-node.sh fleet-node.sh
          if gh release view fleet-installer >/dev/null 2>&1; then
            gh release upload fleet-installer image-assets/*.part-* --clobber
          else
            gh release create fleet-installer image-assets/*.part-* \
              --title "Fleet installer" \
              --notes "Current installer image and the one-file node entry. Replaced when Fleet merges. This release does not expire."
          fi
          # Publish the manifest after its parts; partial releases fail verification.
          gh release upload fleet-installer image-assets/*.json image-assets/*.sha256 fleet-node.sh --clobber
          # The wizard downloads: one per platform. Every one passed its self-test in CI.
          find wizard-artifacts -type f -exec ls -l {} +
          count=$(find wizard-artifacts -type f | wc -l)
          test "$count" -ge 5
          gh release upload fleet-installer wizard-artifacts/* --clobber

  cache:
    needs: [changes, check]
    if: always() && github.event_name == 'merge_group' && needs.changes.outputs.fleet == 'true' && needs.check.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Push role closures before this commit can reach main
        working-directory: packages/fleet
        env:
          CACHE_URL: ${{ vars.FLEET_CACHE_URL }}
          CACHE_NAME: ${{ vars.FLEET_CACHE_NAME }}
          ATTIC_TOKEN: ${{ secrets.FLEET_ATTIC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CACHE_URL}" ] || [ -z "${CACHE_NAME}" ] || [ -z "${ATTIC_TOKEN}" ]; then
            echo 'TODO: set FLEET_CACHE_URL, FLEET_CACHE_NAME, and FLEET_ATTIC_TOKEN. A fleet commit cannot merge until the cache push succeeds.' >&2
            exit 1
          fi
          for attr in ci web cache netboot devbox; do
            nix build -o "result-${attr}" ".#${attr}"
            if [ ! -L "result-${attr}" ] || [ ! -d "result-${attr}" ]; then
              echo "Fleet cache: missing build result for ${attr}. Rebuild this role before publishing." >&2
              exit 1
            fi
          done
          nix run '.#attic-client' -- login fleet "$CACHE_URL" "$ATTIC_TOKEN"
          for attr in ci web cache netboot devbox; do
            nix run '.#attic-client' -- push "$CACHE_NAME" "./result-${attr}"
          done

  gate:
    name: Fleet
    needs: [changes, check, wizard, cache, publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report the fleet check
        env:
          EVENT: ${{ github.event_name }}
          CHANGES: ${{ needs.changes.result }}
          FLEET: ${{ needs.changes.outputs.fleet }}
          CHECK: ${{ needs.check.result }}
          WIZARD: ${{ needs.wizard.result }}
          CACHE: ${{ needs.cache.result }}
          PUBLISH: ${{ needs.publish.result }}
        run: |
          set -euo pipefail
          echo "event=${EVENT} changes=${CHANGES} fleet=${FLEET} check=${CHECK} wizard=${WIZARD} cache=${CACHE} publish=${PUBLISH}"
          if [ "${CHANGES}" != "success" ]; then
            echo "changes job ${CHANGES}" >&2
            exit 1
          fi
          if [ "${EVENT}" != "workflow_dispatch" ] && [ "${FLEET}" != "true" ]; then
            exit 0
          fi
          if [ "${CHECK}" != "success" ]; then
            echo "fleet check did not succeed: ${CHECK}" >&2
            exit 1
          fi
          if [ "${WIZARD}" != "success" ]; then
            echo "the installer did not build and pass its self-test on every platform: ${WIZARD}" >&2
            exit 1
          fi
          if [ "${EVENT}" = "merge_group" ] && [ "${CACHE}" != "success" ]; then
            echo "binary cache push did not succeed: ${CACHE}" >&2
            exit 1
          fi
          if [ "${EVENT}" = "merge_group" ] || [ "${EVENT}" = "push" ] || [ "${EVENT}" = "workflow_dispatch" ]; then
            if [ "${PUBLISH}" != "success" ]; then
              echo "durable installer was not published: ${PUBLISH}" >&2
              exit 1
            fi
          fi
