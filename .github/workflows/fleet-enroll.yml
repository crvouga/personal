name: Fleet enroll
on:
  issues:
    types:
      - opened
permissions: {}
concurrency:
  group: fleet-enroll-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  approve:
    if: github.event.issue.author_association == 'OWNER' &&
      startsWith(github.event.issue.title, 'fleet-enroll ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Mint a wrapped enrollment token and seal it to the node
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          RESULT_FILE: ${{ runner.temp }}/result.txt
        run: |
          export VAULT_ADDR="$(python3 -c 'import json; print("https://" + json.load(open("packages/infra/tofu/modules/inventory/inventory.tf.json"))["locals"]["inventory"]["vault"]["hostname"])')"
          python3 -I vendor/fleet/packages/fleet/scripts/enroll.py
      - name: Answer on the issue and close it
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          RESULT_FILE: ${{ runner.temp }}/result.txt
        run: >
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file
          "$RESULT_FILE"

          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --reason completed
